name: deploy

on:
  workflow_dispatch:

concurrency:
  group: plumb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    env:
      PLUMB_SITE_TOKEN: ${{ secrets.PLUMB_SITE_TOKEN }}
      PLUMB_SITE_ACCOUNT: ${{ vars.PLUMB_SITE_ACCOUNT }}
      PLUMB_SITE_DOMAIN: ${{ vars.PLUMB_SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Install JS dependencies
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          corepack enable
          pnpm install --frozen-lockfile

      - name: Ship
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          # The lane runs canonical stable Plumb, so it asks the binary which
          # spelling it holds rather than assuming one.
          if plumb ship site deploy --help >/dev/null 2>&1; then
            plumb ship site deploy
          else
            plumb site deploy
          fi

      - name: Report failure
        if: failure()
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deno eval '
            const temp = Deno.env.get("RUNNER_TEMP");
            const log = await Deno.readTextFile(`${temp}/lane.log`).catch(() => "(no lane.log captured)");
            const keys = ["PLUMB_SITE_TOKEN"];
            let safe = log;
            for (const key of keys) {
              const held = Deno.env.get(key) ?? "";
              if (held !== "") safe = safe.split(held).join("<secret>");
            }
            const tail = safe.split("\n").slice(-120).join("\n");
            const api = Deno.env.get("GITHUB_API_URL");
            const repo = Deno.env.get("GITHUB_REPOSITORY");
            const flow = Deno.env.get("GITHUB_WORKFLOW");
            const run = Deno.env.get("GITHUB_RUN_NUMBER");
            const job = Deno.env.get("GITHUB_JOB");
            const res = await fetch(`${api}/repos/${repo}/issues`, {
              method: "POST",
              headers: {
                Authorization: `token ${Deno.env.get("PROBE_TOKEN")}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                title: `${flow} run ${run}: ${job} failed`,
                body: "```\n" + tail + "\n```",
              }),
            });
            console.log(`failure report: HTTP ${res.status}`);
            await res.body?.cancel();
          '
