name: ship

on:
  workflow_dispatch:
    inputs:
      declaration:
        description: Locked marker-bound blob graph and finite backend
        required: true
        type: string
      marker:
        description: Immutable marker shared by every publication
        required: true
        type: string
      plumb:
        description: Exact dispatching Plumb identity
        required: true
        type: string
      repository:
        description: Product repository
        required: true
        type: string

permissions:
  contents: read

env:
  PLUMB_RELEASE_ROOT: .
  PLUMB_RELEASE_MARKER: ${{ inputs.marker }}
  PLUMB_SHIP_DECLARATION: ${{ inputs.declaration }}
  PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
  PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
  PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
  PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
  PLUMB_WORKFLOW_INVENTORY_URL: ${{ secrets.WORKFLOW_INVENTORY_ORIGIN }}

concurrency:
  group: ${{ inputs.repository }}-ship-${{ inputs.marker }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:e4d482921c753e337ba5bd1f5b83281451b07982856603d148daea86a0197bea
    outputs:
      produce: ${{ steps.plan.outputs.produce }}
      produce_needed: ${{ steps.plan.outputs.produce_needed }}
      bind: ${{ steps.plan.outputs.bind }}
      bind_needed: ${{ steps.plan.outputs.bind_needed }}
      publish: ${{ steps.plan.outputs.publish }}
      publish_needed: ${{ steps.plan.outputs.publish_needed }}
      complete: ${{ steps.plan.outputs.complete }}
      complete_needed: ${{ steps.plan.outputs.complete_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Cold plan without Plumb
        id: plan
        run: python3 .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom

  produce:
    needs: [resolve]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.produce_needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.produce) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ (matrix.runner == 'linux' || matrix.runner == 'docker') && 'git.perish.top/perishfire/images/forge@sha256:e4d482921c753e337ba5bd1f5b83281451b07982856603d148daea86a0197bea' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: bash .plumb-atom/.forgejo/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: .plumb-atom/.forgejo/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job produce --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: https://github.com/actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: https://github.com/actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job produce --node ''${{ matrix.node }}'' --execute'

  bind:
    needs: [resolve, produce]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.bind_needed == 'true' && (needs.produce.result == 'success' || needs.produce.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.bind) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ (matrix.runner == 'linux' || matrix.runner == 'docker') && 'git.perish.top/perishfire/images/forge@sha256:e4d482921c753e337ba5bd1f5b83281451b07982856603d148daea86a0197bea' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: bash .plumb-atom/.forgejo/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: .plumb-atom/.forgejo/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job bind --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: https://github.com/actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: https://github.com/actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job bind --node ''${{ matrix.node }}'' --execute'

  publish:
    needs: [resolve, produce, bind]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.publish_needed == 'true' && (needs.produce.result == 'success' || needs.produce.result == 'skipped') && (needs.bind.result == 'success' || needs.bind.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.publish) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ (matrix.runner == 'linux' || matrix.runner == 'docker') && 'git.perish.top/perishfire/images/forge@sha256:e4d482921c753e337ba5bd1f5b83281451b07982856603d148daea86a0197bea' || '' }}
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      PLUMB_RELEASE_TOOLCHAIN: git.perish.top/perishfire/images/forge@sha256:e4d482921c753e337ba5bd1f5b83281451b07982856603d148daea86a0197bea
      PLUMB_RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      PLUMB_SITE_TOKEN: ${{ secrets.PLUMB_SITE_TOKEN }}
      PLUMB_PUBLISH_ACCESS: ${{ secrets.SHIP_PUBLISH_S3_ACCESS_KEY }}
      PLUMB_PUBLISH_SECRET: ${{ secrets.SHIP_PUBLISH_S3_SECRET_KEY }}
      PLUMB_PUBLISH_ENDPOINT: ${{ secrets.SHIP_PUBLISH_S3_ENDPOINT }}
      PLUMB_PUBLISH_FINGERPRINT: ${{ secrets.SHIP_PUBLISH_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: bash .plumb-atom/.forgejo/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: .plumb-atom/.forgejo/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job publish --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: https://github.com/actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: https://github.com/actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job publish --node ''${{ matrix.node }}'' --execute'

  complete:
    needs: [resolve, produce, bind, publish]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.complete_needed == 'true' && (needs.produce.result == 'success' || needs.produce.result == 'skipped') && (needs.bind.result == 'success' || needs.bind.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.complete) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ (matrix.runner == 'linux' || matrix.runner == 'docker') && 'git.perish.top/perishfire/images/forge@sha256:e4d482921c753e337ba5bd1f5b83281451b07982856603d148daea86a0197bea' || '' }}
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      PLUMB_RELEASE_TOOLCHAIN: git.perish.top/perishfire/images/forge@sha256:e4d482921c753e337ba5bd1f5b83281451b07982856603d148daea86a0197bea
      PLUMB_RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      PLUMB_SITE_TOKEN: ${{ secrets.PLUMB_SITE_TOKEN }}
      PLUMB_PUBLISH_ACCESS: ${{ secrets.SHIP_PUBLISH_S3_ACCESS_KEY }}
      PLUMB_PUBLISH_SECRET: ${{ secrets.SHIP_PUBLISH_S3_SECRET_KEY }}
      PLUMB_PUBLISH_ENDPOINT: ${{ secrets.SHIP_PUBLISH_S3_ENDPOINT }}
      PLUMB_PUBLISH_FINGERPRINT: ${{ secrets.SHIP_PUBLISH_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: bash .plumb-atom/.forgejo/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: .plumb-atom/.forgejo/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job complete --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: https://github.com/actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: https://github.com/actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.forgejo/scripts/dispatch.py --control .plumb-atom --job complete --node ''${{ matrix.node }}'' --execute'
