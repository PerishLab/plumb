name: ship

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Immutable release marker shared by every distribution medium
        required: true
        type: string
      repository:
        description: Product repository identity selected by the dispatching Plumb
        required: true
        type: string
  workflow_call:
    inputs:
      marker:
        description: Immutable release marker shared by every distribution medium
        required: false
        default: ""
        type: string
      repository:
        description: Product repository identity selected by the dispatching Plumb
        required: false
        default: ""
        type: string
permissions:
  contents: read

concurrency:
  group: ${{ inputs.repository || github.repository }}-ship-${{ inputs.marker || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      targets: ${{ steps.plan.outputs.targets }}
      binary_missing: ${{ steps.plan.outputs.binary_missing }}
      binary_reuse: ${{ steps.plan.outputs.binary_reuse }}
      project: ${{ steps.plan.outputs.project }}
      project_missing: ${{ steps.plan.outputs.project_missing }}
    env:
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_COMMIT: ${{ github.sha }}
      PLUMB_RELEASE_MARKER: ${{ inputs.marker }}
      PLUMB_RELEASE_SOURCE: ${{ github.ref }}
      PLUMB_WORKFLOW_INVENTORY_URL: ${{ secrets.WORKFLOW_INVENTORY_URL }}
    steps:
      - name: Check out the release marker
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -n "$PLUMB_RELEASE_MARKER"
          remote="${{ github.server_url }}/${{ inputs.repository || github.repository }}.git"
          reference="refs/tags/$PLUMB_RELEASE_MARKER"
          git init .
          git remote add origin "$remote"
          fetch=(git)
          if [ -n "$PLUMB_CHECKOUT_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$PLUMB_CHECKOUT_TOKEN" | base64 | tr -d '\n')
            fetch+=(-c "http.extraheader=AUTHORIZATION: basic $basic")
          fi
          "${fetch[@]}" fetch --no-tags --depth=1 origin "+$reference:$reference"
          git checkout --detach "$reference^{commit}"

      - name: Install bootstrap Plumb
        shell: bash
        run: |
          set -eu
          fetch=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 5 --max-time 30)
          manager="$RUNNER_TEMP/manage-plumb.sh"
          "${fetch[@]}" -o "$manager" "https://releases.plumb.perish.uk/manage.sh"
          held=$("${fetch[@]}" "https://releases.plumb.perish.uk/v1/channels/beta.json" 2>/dev/null \
            | sed -n 's/.*"releaseVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || held=""
          if [ -n "$held" ]; then
            seat="$RUNNER_TEMP/plumb-$held"
            sh "$manager" install \
              --channel beta --version "$held" \
              --install-root "$seat/versions" --bin-dir "$seat/bin"
            printf '%s\n' "$seat/bin" >> "$GITHUB_PATH"
            tool="$seat/bin/plumb"
          else
            sh "$manager"
            printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
            tool="$HOME/.local/bin/plumb"
          fi
          "$tool" depot sync

      - name: Build the exact atom Plumb
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          set -eu
          root="$RUNNER_TEMP/plumb-atom"
          remote="${{ github.server_url }}/${{ github.repository }}.git"
          git init "$root"
          git -C "$root" remote add origin "$remote"
          fetch=(git -C "$root")
          if [ -n "$PLUMB_ATOM_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$PLUMB_ATOM_TOKEN" | base64 | tr -d '\n')
            fetch+=(-c "http.extraheader=AUTHORIZATION: basic $basic")
          fi
          "${fetch[@]}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git -C "$root" checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path "$root/Cargo.toml" --bin plumb
          tool=$(command -v plumb)
          cp "$root/target/debug/plumb" "$tool"
          "$tool" --version

      - name: Build the exact atom Plumb on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'plumb-atom'
          $remote = '${{ github.server_url }}/${{ github.repository }}.git'
          git init $root
          git -C $root remote add origin $remote
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PLUMB_ATOM_TOKEN"))
          git -C $root -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags --depth=1 origin '${{ github.sha }}'
          git -C $root checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path (Join-Path $root 'Cargo.toml') --bin plumb
          $tool = (Get-Command plumb.exe).Source
          Copy-Item (Join-Path $root 'target/debug/plumb.exe') $tool -Force
          & $tool --version

      - name: Plan this release
        id: plan
        shell: bash
        run: |
          set -eu
          if [ -n "$PLUMB_RELEASE_MARKER" ]; then
            marker=$(plumb release marker show --marker "$PLUMB_RELEASE_MARKER" --held)
            PLUMB_RELEASE_COMMIT=$(printf '%s' "$marker" | jq -r '.commit')
            PLUMB_RELEASE_SOURCE="refs/tags/$PLUMB_RELEASE_MARKER"
            export PLUMB_RELEASE_COMMIT
            export PLUMB_RELEASE_SOURCE
          fi
          if plumb release plan --help >/dev/null 2>&1; then
            plan=$(plumb release plan)
            PLUMB_RELEASE_VERSION=$(printf '%s' "$plan" | jq -r '.version')
            PLUMB_RELEASE_CHANNEL=$(printf '%s' "$plan" | jq -r '.channel')
            PLUMB_RELEASE_PROJECT=$(printf '%s' "$plan" | jq -c '.project')
          else
            PLUMB_RELEASE_VERSION=$(plumb release reference)
            export PLUMB_RELEASE_VERSION
            PLUMB_RELEASE_CHANNEL=$(plumb release channel)
            export PLUMB_RELEASE_CHANNEL
            plumb release source
            PLUMB_RELEASE_PROJECT=$(plumb release surface | jq -c '.project')
          fi
          export PLUMB_RELEASE_VERSION
          export PLUMB_RELEASE_CHANNEL
          if [ -n "$PLUMB_RELEASE_MARKER" ]; then
            test "$(printf '%s' "$marker" | jq -r '.marker')" = "$PLUMB_RELEASE_VERSION"
            test "$(printf '%s' "$marker" | jq -r '.channel')" = "$PLUMB_RELEASE_CHANNEL"
            test "$(printf '%s' "$marker" | jq -r '.commit')" = "$PLUMB_RELEASE_COMMIT"
          fi
          targets=$(plumb ship binary matrix)
          binary_reuse='[]'
          binary_missing=false
          inventory="$RUNNER_TEMP/plumb-workflow-inventory.json"
          inventory_arg=
          if [ -n "$PLUMB_WORKFLOW_INVENTORY_URL" ] && curl -fsSL \
            --connect-timeout 3 --max-time 10 --retry 1 \
            -o "$inventory" "$PLUMB_WORKFLOW_INVENTORY_URL"; then
            inventory_arg=$inventory
          fi
          plumb_version=$(plumb --version | awk '{print $2}')
          depot=$(plumb depot show | sed -n '1s/^depot //p')
          if [ "$PLUMB_RELEASE_CHANNEL" != stable ]; then
            pending="$RUNNER_TEMP/plumb-binary-pending.jsonl"
            reused="$RUNNER_TEMP/plumb-binary-reused.jsonl"
            : > "$pending"
            : > "$reused"
            projection=Cargo.toml#/workspace/package/version
            for manifest in package.json packages/*/package.json; do
              if [ -f "$manifest" ] && jq -e '.version | type == "string"' "$manifest" >/dev/null; then
                projection=$manifest#/version
                break
              fi
            done
            printf '%s' "$targets" | jq -c '.include[]' | while IFS= read -r target; do
              triple=$(printf '%s' "$target" | jq -r '.target')
              runner=$(printf '%s' "$target" | jq -r '.runner')
              archive=$(printf '%s' "$target" | jq -r '.archive')
              action="ship/binary.$triple"
              set -- plumb workflow plan \
                --world "atom=${{ github.sha }}" \
                --world "depot=$depot" \
                --world "plumb=$plumb_version" \
                --world "release=$PLUMB_RELEASE_VERSION" \
                --world "runner=$runner" \
                --world "target=$triple" \
                --identity "marker=$PLUMB_RELEASE_MARKER" \
                --project "$action=$projection"
              if [ -n "$inventory_arg" ]; then
                set -- "$@" --inventory "$inventory_arg"
              fi
              planned=$("$@" .)
              node=$(printf '%s' "$planned" | jq -c --arg action "$action" \
                '.actions[] | select(.name == $action)')
              kind=$(printf '%s' "$node" | jq -r '.reuse.type')
              if [ "$kind" = workload ]; then
                printf '%s' "$target" | jq -c \
                  --arg url "$(printf '%s' "$node" | jq -r '.reuse.source')" \
                  '. + {url:$url}' >> "$reused"
              else
                printf '%s' "$target" | jq -c \
                  --arg action "$action" \
                  --argjson keys "$(printf '%s' "$node" | jq -c '.keys')" \
                  '. + {action:$action,keys:$keys}' >> "$pending"
              fi
            done
            targets=$(jq -sc '{include:.}' "$pending")
            binary_reuse=$(jq -sc '.' "$reused")
            binary_missing=$(printf '%s' "$targets" | jq -r '.include | length > 0')
            if [ "$binary_missing" = false ]; then
              targets='{"include":[{"runner":"docker","control":"reuse","target":"reuse","archive":"none"}]}'
            fi
          fi
          project_pending="$RUNNER_TEMP/plumb-project-pending.jsonl"
          : > "$project_pending"
          printf '%s' "$PLUMB_RELEASE_PROJECT" | jq -c '.include[]' | while IFS= read -r entry; do
            action=$(printf '%s' "$entry" | jq -r '.action // empty')
            if [ -z "$action" ]; then
              printf '%s\n' "$entry" >> "$project_pending"
              continue
            fi
            command=(plumb workflow plan \
              --world "atom=${{ github.sha }}" \
              --world "depot=$depot" \
              --world "plumb=$plumb_version" \
              --world "runner=docker" \
              --identity "marker=$PLUMB_RELEASE_MARKER")
            while IFS= read -r projection; do
              command+=(--project "$action=$projection")
            done < <(printf '%s' "$entry" | jq -r '(.projections // [.projection])[]')
            while IFS= read -r root; do
              command+=(--root "$action=$root")
            done < <(printf '%s' "$entry" | jq -r '.roots[]')
            if [ -n "$inventory_arg" ]; then
              command+=(--inventory "$inventory_arg")
            fi
            planned=$("${command[@]}" .)
            node=$(printf '%s' "$planned" | jq -c --arg action "$action" \
              '.actions[] | select(.name == $action)')
            kind=$(printf '%s' "$node" | jq -r '.reuse.type')
            if [ "$kind" != url ]; then
              printf '%s' "$entry" | jq -c \
                --argjson reuse "$(printf '%s' "$node" | jq -c '.reuse')" \
                --argjson keys "$(printf '%s' "$node" | jq -c '.keys')" \
                '. + {reuse:$reuse,keys:$keys}' >> "$project_pending"
            fi
          done
          PLUMB_RELEASE_PROJECT=$(jq -sc '{include:.}' "$project_pending")
          project_missing=$(printf '%s' "$PLUMB_RELEASE_PROJECT" | jq -r '.include | length > 0')
          if [ "$project_missing" = false ]; then
            PLUMB_RELEASE_PROJECT='{"include":[{"medium":"none","prepare":"none","control":"reuse"}]}'
          fi
          {
            echo "channel=$PLUMB_RELEASE_CHANNEL"
            echo "commit=$PLUMB_RELEASE_COMMIT"
            echo "version=$PLUMB_RELEASE_VERSION"
            echo "targets=$targets"
            echo "binary_missing=$binary_missing"
            echo "binary_reuse=$binary_reuse"
            echo "project=$PLUMB_RELEASE_PROJECT"
            echo "project_missing=$project_missing"
          } >> "$GITHUB_OUTPUT"

  materialize:
    needs: resolve
    if: needs.resolve.outputs.channel != 'stable'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    env:
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      PLUMB_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      PLUMB_RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      PLUMB_RELEASE_TARGET: ${{ matrix.target }}
      PLUMB_RELEASE_ARTIFACTS: dist/${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.control != 'reuse'
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Install bootstrap Plumb
        shell: bash
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        run: |
          set -eu
          fetch=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 5 --max-time 30)
          manager="$RUNNER_TEMP/manage-plumb.sh"
          "${fetch[@]}" -o "$manager" "https://releases.plumb.perish.uk/manage.sh"
          held=$("${fetch[@]}" "https://releases.plumb.perish.uk/v1/channels/beta.json" 2>/dev/null \
            | sed -n 's/.*"releaseVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || held=""
          if [ -n "$held" ]; then
            seat="$RUNNER_TEMP/plumb-$held"
            sh "$manager" install \
              --channel beta --version "$held" \
              --install-root "$seat/versions" --bin-dir "$seat/bin"
            printf '%s\n' "$seat/bin" >> "$GITHUB_PATH"
            tool="$seat/bin/plumb"
          else
            sh "$manager"
            printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
            tool="$HOME/.local/bin/plumb"
          fi
          "$tool" depot sync

      - name: Install stable Plumb on Windows
        if: matrix.control != 'reuse' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manager = Join-Path $env:RUNNER_TEMP 'manage-plumb.ps1'
          $seat = Join-Path $env:RUNNER_TEMP 'plumb-bootstrap'
          $versions = Join-Path $seat 'versions'
          $bin = Join-Path $seat 'bin'
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://releases.plumb.perish.uk/manage.ps1' -OutFile $manager
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds $attempt
            }
          }
          & $manager install --install-root $versions --bin-dir $bin
          & (Join-Path $bin 'plumb.exe') depot sync
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build the exact atom Plumb
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          set -eu
          root="$RUNNER_TEMP/plumb-atom"
          remote="${{ github.server_url }}/${{ github.repository }}.git"
          git init "$root"
          git -C "$root" remote add origin "$remote"
          fetch=(git -C "$root")
          if [ -n "$PLUMB_ATOM_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$PLUMB_ATOM_TOKEN" | base64 | tr -d '\n')
            fetch+=(-c "http.extraheader=AUTHORIZATION: basic $basic")
          fi
          "${fetch[@]}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git -C "$root" checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path "$root/Cargo.toml" --bin plumb
          tool=$(command -v plumb)
          cp "$root/target/debug/plumb" "$tool"
          "$tool" --version

      - name: Build the exact atom Plumb on Windows
        if: matrix.control != 'reuse' && runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'plumb-atom'
          $remote = '${{ github.server_url }}/${{ github.repository }}.git'
          git init $root
          git -C $root remote add origin $remote
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PLUMB_ATOM_TOKEN"))
          git -C $root -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags --depth=1 origin '${{ github.sha }}'
          git -C $root checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path (Join-Path $root 'Cargo.toml') --bin plumb
          $tool = (Get-Command plumb.exe).Source
          Copy-Item (Join-Path $root 'target/debug/plumb.exe') $tool -Force
          & $tool --version

      - name: Add the declared Rust target
        if: matrix.control != 'reuse'
        run: rustup target add ${{ matrix.target }}

      - name: Build one declared target
        if: matrix.control != 'reuse'
        run: plumb ship binary build

      - uses: actions/upload-artifact@v3
        if: matrix.control != 'reuse'
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ needs.resolve.outputs.version }}/*

  seal:
    needs: [resolve, materialize]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.channel == 'stable' || needs.materialize.result == 'success' ||
      (needs.materialize.result == 'skipped' && needs.resolve.outputs.binary_missing == 'false'))
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    outputs:
      manager_unix: ${{ steps.surface.outputs.manager_unix }}
      manager_windows: ${{ steps.surface.outputs.manager_windows }}
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      PLUMB_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      PLUMB_RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      PLUMB_RELEASE_ARTIFACTS: dist/${{ needs.resolve.outputs.version }}
      PLUMB_RELEASE_TOOLCHAIN: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
      PLUMB_RELEASE_OUTPUT: .plumb-release/capsule
      PLUMB_RELEASE_CAPSULE: .plumb-release/capsule/capsule.json
      PLUMB_PUBLISH_ACCESS: ${{ secrets.RELEASE_PUBLISH_S3_ACCESS_KEY }}
      PLUMB_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_S3_SECRET_KEY }}
      PLUMB_PUBLISH_BUCKET: ${{ secrets.RELEASE_PUBLISH_S3_BUCKET }}
      PLUMB_PUBLISH_ENDPOINT: ${{ secrets.RELEASE_PUBLISH_S3_ENDPOINT }}
      PLUMB_ACTIVATE_ACCESS: ${{ secrets.RELEASE_ACTIVATE_S3_ACCESS_KEY }}
      PLUMB_ACTIVATE_SECRET: ${{ secrets.RELEASE_ACTIVATE_S3_SECRET_KEY }}
      PLUMB_ACTIVATE_BUCKET: ${{ secrets.RELEASE_ACTIVATE_S3_BUCKET }}
      PLUMB_ACTIVATE_ENDPOINT: ${{ secrets.RELEASE_ACTIVATE_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Install bootstrap Plumb
        shell: bash
        run: |
          set -eu
          fetch=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 5 --max-time 30)
          manager="$RUNNER_TEMP/manage-plumb.sh"
          "${fetch[@]}" -o "$manager" "https://releases.plumb.perish.uk/manage.sh"
          held=$("${fetch[@]}" "https://releases.plumb.perish.uk/v1/channels/beta.json" 2>/dev/null \
            | sed -n 's/.*"releaseVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || held=""
          if [ -n "$held" ]; then
            seat="$RUNNER_TEMP/plumb-$held"
            sh "$manager" install \
              --channel beta --version "$held" \
              --install-root "$seat/versions" --bin-dir "$seat/bin"
            printf '%s\n' "$seat/bin" >> "$GITHUB_PATH"
            tool="$seat/bin/plumb"
          else
            sh "$manager"
            printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
            tool="$HOME/.local/bin/plumb"
          fi
          "$tool" depot sync

      - name: Build the exact atom Plumb
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          set -eu
          root="$RUNNER_TEMP/plumb-atom"
          remote="${{ github.server_url }}/${{ github.repository }}.git"
          git init "$root"
          git -C "$root" remote add origin "$remote"
          fetch=(git -C "$root")
          if [ -n "$PLUMB_ATOM_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$PLUMB_ATOM_TOKEN" | base64 | tr -d '\n')
            fetch+=(-c "http.extraheader=AUTHORIZATION: basic $basic")
          fi
          "${fetch[@]}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git -C "$root" checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path "$root/Cargo.toml" --bin plumb
          tool=$(command -v plumb)
          cp "$root/target/debug/plumb" "$tool"
          "$tool" --version

      - name: Build the exact atom Plumb on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'plumb-atom'
          $remote = '${{ github.server_url }}/${{ github.repository }}.git'
          git init $root
          git -C $root remote add origin $remote
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PLUMB_ATOM_TOKEN"))
          git -C $root -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags --depth=1 origin '${{ github.sha }}'
          git -C $root checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path (Join-Path $root 'Cargo.toml') --bin plumb
          $tool = (Get-Command plumb.exe).Source
          Copy-Item (Join-Path $root 'target/debug/plumb.exe') $tool -Force
          & $tool --version

      - name: Fetch the derived promotion proof and its binary artifacts
        if: needs.resolve.outputs.channel == 'stable'
        env:
          PLUMB_RELEASE_PROMOTION: .plumb-release/promotion.json
        run: plumb release promote

      - uses: actions/download-artifact@v3
        if: needs.resolve.outputs.channel != 'stable' && needs.resolve.outputs.binary_missing == 'true'
        with:
          path: dist/${{ needs.resolve.outputs.version }}

      - name: Fetch reused binary workloads
        if: needs.resolve.outputs.channel != 'stable'
        env:
          PLUMB_BINARY_REUSE: ${{ needs.resolve.outputs.binary_reuse }}
        shell: bash
        run: |
          set -eu
          printf '%s' "$PLUMB_BINARY_REUSE" | jq -c '.[]' | while IFS= read -r reused; do
            target=$(printf '%s' "$reused" | jq -r '.target')
            archive=$(printf '%s' "$reused" | jq -r '.archive')
            url=$(printf '%s' "$reused" | jq -r '.url')
            seat="dist/${{ needs.resolve.outputs.version }}/reuse-$target"
            mkdir -p "$seat"
            curl -fsSL --retry 3 -o "$seat/$archive" "$url"
          done

      - name: Record the fresh binary workloads
        if: needs.resolve.outputs.channel != 'stable' && needs.resolve.outputs.binary_missing == 'true'
        env:
          PLUMB_BINARY_TARGETS: ${{ needs.resolve.outputs.targets }}
          PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
          PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
          PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
          PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
          PLUMB_WORKFLOW_INVENTORY_URL: ${{ secrets.WORKFLOW_INVENTORY_URL }}
        shell: bash
        run: |
          set -eu
          printf '%s' "$PLUMB_BINARY_TARGETS" | jq -c '.include[]' | while IFS= read -r target; do
            action=$(printf '%s' "$target" | jq -r '.action')
            archive=$(printf '%s' "$target" | jq -r '.archive')
            keys=$(printf '%s' "$target" | jq -c '.keys')
            workload=$(find "$PLUMB_RELEASE_ARTIFACTS" -type f -name "$archive" -print -quit)
            test -n "$workload"
            plumb workflow record "$action" --keys "$keys" --workload "$workload"
          done

      - name: Assemble the declared binary shape
        run: plumb ship binary assemble

      - name: Compile the exact capsule
        if: needs.resolve.outputs.channel != 'stable'
        run: plumb release compile

      - name: Compile the stable capsule
        if: needs.resolve.outputs.channel == 'stable'
        env:
          PLUMB_RELEASE_PROMOTION: .plumb-release/promotion.json
        run: plumb release compile

      - name: Publish and read back the exact release
        shell: bash
        run: |
          set -eu
          plumb ship binary publish
          plumb ship binary verify

      - name: Point the channel at what this run published
        shell: bash
        run: |
          set -eu
          plumb release activate

      - name: Activate the stable consensus
        if: needs.resolve.outputs.channel == 'stable'
        shell: bash
        run: |
          set -eu
          plumb ship binary activate
          PLUMB_RELEASE_ACTIVATED=true plumb ship binary verify

      - name: Name the generated managers
        id: surface
        shell: bash
        run: |
          set -eu
          if [ "$PLUMB_RELEASE_CHANNEL" = stable ]; then
            seat="$PLUMB_RELEASE_OUTPUT/stable.json"
          else
            seat="$PLUMB_RELEASE_OUTPUT/seal.json"
          fi
          {
            echo "manager_unix=$(jq -r '.managers.unix.url' "$seat")"
            echo "manager_windows=$(jq -r '.managers.windows.url // ""' "$seat")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v3
        with:
          name: release-capsule
          path: .plumb-release/capsule

  verify:
    needs: [resolve, seal]
    if: needs.resolve.outputs.channel != 'stable'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    env:
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.control != 'reuse'
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Install bootstrap Plumb
        shell: bash
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        run: |
          set -eu
          fetch=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 5 --max-time 30)
          manager="$RUNNER_TEMP/manage-plumb.sh"
          "${fetch[@]}" -o "$manager" "https://releases.plumb.perish.uk/manage.sh"
          held=$("${fetch[@]}" "https://releases.plumb.perish.uk/v1/channels/beta.json" 2>/dev/null \
            | sed -n 's/.*"releaseVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || held=""
          if [ -n "$held" ]; then
            seat="$RUNNER_TEMP/plumb-$held"
            sh "$manager" install \
              --channel beta --version "$held" \
              --install-root "$seat/versions" --bin-dir "$seat/bin"
            printf '%s\n' "$seat/bin" >> "$GITHUB_PATH"
            tool="$seat/bin/plumb"
          else
            sh "$manager"
            printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
            tool="$HOME/.local/bin/plumb"
          fi
          "$tool" depot sync

      - name: Install stable Plumb on Windows
        if: matrix.control != 'reuse' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manager = Join-Path $env:RUNNER_TEMP 'manage-plumb.ps1'
          $seat = Join-Path $env:RUNNER_TEMP 'plumb-bootstrap'
          $versions = Join-Path $seat 'versions'
          $bin = Join-Path $seat 'bin'
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri 'https://releases.plumb.perish.uk/manage.ps1' -OutFile $manager
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds $attempt
            }
          }
          & $manager install --install-root $versions --bin-dir $bin
          & (Join-Path $bin 'plumb.exe') depot sync
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build the exact atom Plumb
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          set -eu
          root="$RUNNER_TEMP/plumb-atom"
          remote="${{ github.server_url }}/${{ github.repository }}.git"
          git init "$root"
          git -C "$root" remote add origin "$remote"
          fetch=(git -C "$root")
          if [ -n "$PLUMB_ATOM_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$PLUMB_ATOM_TOKEN" | base64 | tr -d '\n')
            fetch+=(-c "http.extraheader=AUTHORIZATION: basic $basic")
          fi
          "${fetch[@]}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git -C "$root" checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path "$root/Cargo.toml" --bin plumb
          tool=$(command -v plumb)
          cp "$root/target/debug/plumb" "$tool"
          "$tool" --version

      - name: Build the exact atom Plumb on Windows
        if: matrix.control != 'reuse' && runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_ATOM_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'plumb-atom'
          $remote = '${{ github.server_url }}/${{ github.repository }}.git'
          git init $root
          git -C $root remote add origin $remote
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:PLUMB_ATOM_TOKEN"))
          git -C $root -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags --depth=1 origin '${{ github.sha }}'
          git -C $root checkout --detach FETCH_HEAD
          cargo build --quiet --locked --manifest-path (Join-Path $root 'Cargo.toml') --bin plumb
          $tool = (Get-Command plumb.exe).Source
          Copy-Item (Join-Path $root 'target/debug/plumb.exe') $tool -Force
          & $tool --version

      - name: Smoke the generated manager
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        env:
          PLUMB_RELEASE_URL: ${{ needs.seal.outputs.manager_unix }}
        run: plumb ship binary smoke

      - name: Smoke the generated manager on Windows
        if: matrix.control != 'reuse' && runner.os == 'Windows'
        env:
          PLUMB_RELEASE_URL: ${{ needs.seal.outputs.manager_windows }}
        run: plumb ship binary smoke

  project:
    needs: [resolve, seal]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.project) }}
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      PLUMB_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      PLUMB_RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      PLUMB_RELEASE_OUTPUT: .plumb-release/capsule
      PLUMB_RELEASE_CAPSULE: .plumb-release/capsule/capsule.json
      PLUMB_RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      PLUMB_SITE_TOKEN: ${{ secrets.PLUMB_SITE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.control != 'reuse'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Install bootstrap Plumb
        shell: bash
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        run: |
          set -eu
          fetch=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 5 --max-time 30)
          manager="$RUNNER_TEMP/manage-plumb.sh"
          "${fetch[@]}" -o "$manager" "https://releases.plumb.perish.uk/manage.sh"
          held=$("${fetch[@]}" "https://releases.plumb.perish.uk/v1/channels/beta.json" 2>/dev/null \
