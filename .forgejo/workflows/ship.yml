name: ship

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Immutable release marker shared by every publication
        required: true
        type: string
      plumb:
        description: Exact Plumb atom version selected by the dispatcher
        required: true
        type: string
      repository:
        description: Product repository identity selected by the dispatching Plumb
        required: true
        type: string
permissions:
  contents: read

env:
  PLUMB_BUILD_VERSION: ${{ inputs.plumb }}
  PLUMB_BUILD_COMMIT: ${{ github.sha }}
  PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
  PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
  PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
  PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
  PLUMB_WORKFLOW_INVENTORY_URL: ${{ secrets.WORKFLOW_INVENTORY_URL }}

concurrency:
  group: ${{ inputs.repository }}-ship-${{ inputs.marker }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    outputs:
      atom: ${{ steps.atom.outputs.source }}
      channel: ${{ steps.plan.outputs.channel }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      workload: ${{ steps.plan.outputs.workload }}
      workload_missing: ${{ steps.plan.outputs.workload_missing }}
      publication: ${{ steps.plan.outputs.publication }}
      publication_missing: ${{ steps.plan.outputs.publication_missing }}
      publication_ready: ${{ steps.plan.outputs.publication_ready }}
    env:
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_MARKER: ${{ inputs.marker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Check out the release marker
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: |
          set -eu
          test -n "$PLUMB_RELEASE_MARKER"
          remote="${{ github.server_url }}/${{ inputs.repository }}.git"
          reference="refs/tags/$PLUMB_RELEASE_MARKER"
          git init .
          git remote add origin "$remote"
          bash .plumb-atom/.forgejo/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"
          git checkout --detach "$reference^{commit}"

      - name: Install the exact atom Plumb
        id: atom
        shell: bash
        run: bash .plumb-atom/.forgejo/scripts/bootstrap-plumb.sh .plumb-atom exact

      - name: Resolve missing workloads
        id: plan
        shell: bash
        run: bash .plumb-atom/.forgejo/scripts/resolve-ship.sh '${{ github.sha }}'

  workload:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.workload) }}
    runs-on: ${{ matrix.runner }}
    env:
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      PLUMB_RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      PLUMB_RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      PLUMB_RELEASE_ARTIFACTS: dist/${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.control != 'reuse'
        with:
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ needs.resolve.outputs.commit }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: matrix.control != 'reuse'
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Install the exact atom Plumb
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        shell: bash
        run: bash .plumb-atom/.forgejo/scripts/bootstrap-plumb.sh .plumb-atom exact

      - name: Install the exact atom Plumb on Windows
        if: matrix.control != 'reuse' && runner.os == 'Windows'
        shell: pwsh
        run: .plumb-atom/.forgejo/scripts/bootstrap-plumb.ps1 .plumb-atom exact

      - name: Add the requested Rust target
        if: matrix.control != 'reuse'
        run: rustup target add ${{ matrix.request.operation.target }}

      - name: Execute one workload request
        if: matrix.control != 'reuse' && runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_SHIP_REQUEST: ${{ toJSON(matrix.request) }}
        run: bash .plumb-atom/.forgejo/scripts/execute-ship.sh

      - name: Execute one workload request on Windows
        if: matrix.control != 'reuse' && runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_SHIP_REQUEST: ${{ toJSON(matrix.request) }}
        run: .plumb-atom/.forgejo/scripts/execute-ship.ps1

  publish_plan:
    needs: [resolve, workload]
    if: always() && needs.resolve.result == 'success' && needs.workload.result == 'success'
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    outputs:
      atom: ${{ needs.resolve.outputs.atom }}
      channel: ${{ steps.plan.outputs.channel || steps.carry.outputs.channel }}
      commit: ${{ steps.plan.outputs.commit || steps.carry.outputs.commit }}
      version: ${{ steps.plan.outputs.version || steps.carry.outputs.version }}
      publication: ${{ steps.plan.outputs.publication || steps.carry.outputs.publication }}
      publication_missing: ${{ steps.plan.outputs.publication_missing || steps.carry.outputs.publication_missing }}
    env:
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_MARKER: ${{ inputs.marker }}
    steps:
      - uses: actions/checkout@v6
        if: needs.resolve.outputs.publication_ready != 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: needs.resolve.outputs.publication_ready != 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Install the exact atom Plumb
        if: needs.resolve.outputs.publication_ready != 'true'
        shell: bash
        env:
          PLUMB_ATOM_SOURCE: ${{ needs.resolve.outputs.atom }}
        run: bash .plumb-atom/.forgejo/scripts/bootstrap-plumb.sh .plumb-atom exact

      - name: Resolve missing publications
        id: plan
        if: needs.resolve.outputs.publication_ready != 'true'
        shell: bash
        run: bash .plumb-atom/.forgejo/scripts/resolve-ship.sh '${{ github.sha }}' ready

      - name: Carry already resolved publications
        id: carry
        if: needs.resolve.outputs.publication_ready == 'true'
        shell: bash
        env:
          PLUMB_CARRY_CHANNEL: ${{ needs.resolve.outputs.channel }}
          PLUMB_CARRY_COMMIT: ${{ needs.resolve.outputs.commit }}
          PLUMB_CARRY_VERSION: ${{ needs.resolve.outputs.version }}
          PLUMB_CARRY_PUBLICATION: ${{ needs.resolve.outputs.publication }}
          PLUMB_CARRY_PUBLICATION_MISSING: ${{ needs.resolve.outputs.publication_missing }}
        run: |
          printf 'channel=%s\n' "$PLUMB_CARRY_CHANNEL" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$PLUMB_CARRY_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$PLUMB_CARRY_VERSION" >> "$GITHUB_OUTPUT"
          printf 'publication=%s\n' "$PLUMB_CARRY_PUBLICATION" >> "$GITHUB_OUTPUT"
          printf 'publication_missing=%s\n' "$PLUMB_CARRY_PUBLICATION_MISSING" >> "$GITHUB_OUTPUT"

  publication:
    needs: publish_plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish_plan.outputs.publication) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      PLUMB_RELEASE_ROOT: .
      PLUMB_RELEASE_MARKER: ${{ inputs.marker }}
      PLUMB_RELEASE_CHANNEL: ${{ needs.publish_plan.outputs.channel }}
      PLUMB_RELEASE_VERSION: ${{ needs.publish_plan.outputs.version }}
      PLUMB_RELEASE_COMMIT: ${{ needs.publish_plan.outputs.commit }}
      PLUMB_RELEASE_ARTIFACTS: dist/${{ needs.publish_plan.outputs.version }}
      PLUMB_RELEASE_OUTPUT: .plumb-release/capsule
      PLUMB_RELEASE_CAPSULE: .plumb-release/capsule/capsule.json
      PLUMB_RELEASE_PROMOTION: .plumb-release/promotion.json
      PLUMB_RELEASE_TOOLCHAIN: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
      PLUMB_RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      PLUMB_SITE_TOKEN: ${{ secrets.PLUMB_SITE_TOKEN }}
      PLUMB_PUBLISH_ACCESS: ${{ secrets.RELEASE_PUBLISH_S3_ACCESS_KEY }}
      PLUMB_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_S3_SECRET_KEY }}
      PLUMB_PUBLISH_BUCKET: ${{ secrets.RELEASE_PUBLISH_S3_BUCKET }}
      PLUMB_PUBLISH_ENDPOINT: ${{ secrets.RELEASE_PUBLISH_S3_ENDPOINT }}
      PLUMB_PUBLISH_FINGERPRINT: ${{ secrets.RELEASE_PUBLISH_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.control != 'reuse'
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ needs.publish_plan.outputs.commit }}
          token: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: matrix.control != 'reuse'
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Install the exact atom Plumb
        if: matrix.control != 'reuse'
        shell: bash
        env:
          PLUMB_ATOM_SOURCE: ${{ needs.publish_plan.outputs.atom }}
        run: bash .plumb-atom/.forgejo/scripts/bootstrap-plumb.sh .plumb-atom exact

      - name: Fetch the exact release marker
        if: matrix.control != 'reuse'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ secrets.SHIP_FORGEJO_TOKEN || github.token }}
        run: bash .plumb-atom/.forgejo/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Execute one publication request
        if: matrix.control != 'reuse'
        shell: bash
        env:
          PLUMB_SHIP_REQUEST: ${{ toJSON(matrix.request) }}
        run: bash .plumb-atom/.forgejo/scripts/execute-ship.sh
