name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ectropy
        run: |
          set -eu
          curl -fsSL https://releases.ectropy.perish.uk/manage.sh | sh -s -- install --channel beta --version v0.4.0-beta.1 --bin-dir $HOME/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install JS dependencies
        run: |
          set -eu
          corepack enable
          pnpm install --frozen-lockfile

      - name: Guard
        run: |
          set -eu
          deno run --allow-read "--allow-write=." --allow-env --allow-net "--allow-run=git,cargo,rustc,ectropy,deno,tea,sh,bash,pnpm,node,runseal,sed,grep" --config .runseal/deno.json --lock .runseal/deno.lock --frozen=true .runseal/wrappers/guard.ts --fresh
