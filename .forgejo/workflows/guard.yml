name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ectropy
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          curl -fsSL https://releases.ectropy.perish.uk/manage.sh | sh -s -- install --channel stable --bin-dir $HOME/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install JS dependencies
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          corepack enable
          pnpm install --frozen-lockfile

      - name: Guard
        run: |
          set -eu
          exec > >(tee -a "$RUNNER_TEMP/lane.log") 2>&1
          deno run --allow-read "--allow-write=." --allow-env --allow-net "--allow-run=git,cargo,rustc,ectropy,deno,tea,sh,bash,pnpm,node,runseal,sed,grep" --config .runseal/deno.json --lock .runseal/deno.lock --frozen=true .runseal/wrappers/guard.ts --fresh

      - name: Report failure
        if: failure()
        env:
          PROBE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deno eval '
            const temp = Deno.env.get("RUNNER_TEMP");
            const log = await Deno.readTextFile(`${temp}/lane.log`).catch(() => "(no lane.log captured)");
            const keys = ["PLUMB_RELEASES_S3_AK", "PLUMB_RELEASES_S3_SK"];
            let safe = log;
            for (const key of keys) {
              const held = Deno.env.get(key) ?? "";
              if (held !== "") safe = safe.split(held).join("<secret>");
            }
            const tail = safe.split("\n").slice(-120).join("\n");
            const api = Deno.env.get("GITHUB_API_URL");
            const repo = Deno.env.get("GITHUB_REPOSITORY");
            const flow = Deno.env.get("GITHUB_WORKFLOW");
            const run = Deno.env.get("GITHUB_RUN_NUMBER");
            const job = Deno.env.get("GITHUB_JOB");
            const res = await fetch(`${api}/repos/${repo}/issues`, {
              method: "POST",
              headers: {
                Authorization: `token ${Deno.env.get("PROBE_TOKEN")}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                title: `${flow} run ${run}: ${job} failed`,
                body: "```\n" + tail + "\n```",
              }),
            });
            console.log(`failure report: HTTP ${res.status}`);
            await res.body?.cancel();
          '
