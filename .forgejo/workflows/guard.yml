name: guard

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: git.perish.top/perishfire/images/forge@sha256:3bc746c0428576eb47c1ece051f2dfa6f6016094be6565977268f76dc1f269a0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        run: curl -fsSL https://releases.ectropy.perish.uk/manage.sh | sh

      - name: Install declared packages
        run: |
          set -eu
          corepack enable
          pnpm install --frozen-lockfile

      - name: Guard
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo check --locked --workspace --all-targets --release
          pnpm biome ci .
          pnpm -r exec tsc --noEmit
          pnpm -r test
          pnpm --filter @plumb/web build
          cargo run --quiet --locked --bin plumb -- doctor .
          ectropy .

