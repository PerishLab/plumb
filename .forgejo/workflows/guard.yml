name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install JS dependencies
        run: |
          set -eu
          corepack enable
          pnpm install --frozen-lockfile

      - name: Guard
        run: |
          set -eu
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo check --locked --workspace --all-targets --release
          pnpm biome ci .
          pnpm -r exec tsc --noEmit
          pnpm -r test
          pnpm --filter @plumb/web build
          cargo run --quiet --locked -p plumb-cli -- doctor .
          ectropy .

  guard-windows:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo run --quiet --locked -p plumb-cli -- doctor .
          ectropy .
