name: release-verify

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Published channel: beta or stable"
        required: true
        default: "beta"
        type: string
      version:
        description: "Published version, for example v0.4.0-beta.2"
        required: true
        type: string

concurrency:
  group: plumb-release-verify-${{ inputs.channel }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  PLUMB_RELEASES_PUBLIC_URL: ${{ vars.PLUMB_RELEASES_PUBLIC_URL }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - uses: actions/checkout@v6

      - name: Validate request
        run: |
          set -eu
          printf '%s\n' "$RELEASE_VERSION" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'
          case "$RELEASE_CHANNEL:$RELEASE_VERSION" in
            beta:*-beta.*) ;;
            stable:*-*) exit 1 ;;
            stable:v*) ;;
            *)
              echo "channel and version do not name a plumb release" >&2
              exit 1
              ;;
          esac

      - name: Verify published release
        env:
          R2_METADATA_URL: ${{ vars.PLUMB_RELEASES_PUBLIC_URL }}/${{ inputs.channel }}/versions/${{ inputs.version }}/metadata.json
        run: bash .forgejo/scripts/release/r2/verify.sh

      - name: Smoke install
        run: sh .forgejo/scripts/release/smoke/smoke.sh "$RELEASE_VERSION" "$RELEASE_CHANNEL"

  platform-smoke:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [macos, windows]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Smoke install
        if: runner.os != 'Windows'
        run: sh .forgejo/scripts/release/smoke/smoke.sh "$RELEASE_VERSION" "$RELEASE_CHANNEL"

      - name: Smoke install
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.forgejo/scripts/release/smoke/smoke.ps1 "$env:RELEASE_VERSION" "$env:RELEASE_CHANNEL"
