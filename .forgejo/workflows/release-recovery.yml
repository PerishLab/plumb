name: release-recovery

# Temporary caller for the exact one-time v0.20.0 self-hosting recovery.
#
# `plumb recovery beta|stable` dispatches this file by the exact name the
# landed recovery core hardcodes, on the caller commit itself. The release
# identity does not come from that dispatch point: the callee is pinned to one
# exact Actions commit and freezes the release line, the frozen commit, the
# generator and both versions on its own side.
#
# This file is retired by deletion once stable v0.20.0 is published, promoted
# and packported. Nothing here outlives that.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Recovery phase, exactly beta or stable
        required: true
        type: string
      beta_sha256:
        description: Exact public beta seal digest, required by stable only
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: PerishLab/actions/.forgejo/workflows/release-recovery-binary.yml@95ff924856d640538be785f570ac91fac926d636
    with:
      phase: ${{ inputs.phase }}
      beta_sha256: ${{ inputs.beta_sha256 }}
      guard_contexts: '["guard / guard (push)"]'
    secrets:
      publish_access: ${{ secrets.RELEASE_PUBLISH_S3_ACCESS_KEY }}
      publish_secret: ${{ secrets.RELEASE_PUBLISH_S3_SECRET_KEY }}
      publish_bucket: ${{ secrets.RELEASE_PUBLISH_S3_BUCKET }}
      publish_endpoint: ${{ secrets.RELEASE_PUBLISH_S3_ENDPOINT }}
      activate_access: ${{ secrets.RELEASE_ACTIVATE_S3_ACCESS_KEY }}
      activate_secret: ${{ secrets.RELEASE_ACTIVATE_S3_SECRET_KEY }}
      activate_bucket: ${{ secrets.RELEASE_ACTIVATE_S3_BUCKET }}
      activate_endpoint: ${{ secrets.RELEASE_ACTIVATE_S3_ENDPOINT }}
      registry_token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
