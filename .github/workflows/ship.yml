name: ship

on:
  workflow_dispatch:
    inputs:
      declaration:
        description: SHA-256 of the immutable Ship or source-acceptance declaration blob
        required: true
        type: string
      marker:
        description: Immutable marker shared by every publication
        required: false
        type: string
      plumb:
        description: Exact dispatching Plumb identity
        required: false
        type: string
      repository:
        description: Product repository
        required: false
        type: string
      source:
        description: Optional full Plumb commit for acceptance only; never publishes a release
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  PLUMB_RELEASE_ROOT: .
  PLUMB_RELEASE_MARKER: ${{ inputs.marker }}
  PLUMB_SHIP_DECLARATION: ${{ inputs.declaration }}
  PLUMB_WORKFLOW_INVENTORY_URL: ${{ secrets.WORKFLOW_INVENTORY_ORIGIN }}

concurrency:
  group: ${{ inputs.repository }}-ship-${{ inputs.marker }}-${{ inputs.source }}
  cancel-in-progress: true

jobs:
  source-suite:
    name: source-suite (${{ matrix.platform }})
    needs: [resolve]
    if: needs.resolve.outputs.mode == 'source'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.suite_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: PerishLab/plumb
          ref: ${{ inputs.source }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.suite_artifact }}
          path: suite-plan
          merge-multiple: true
      - name: Execute or reuse exact native suite without writer credentials
        shell: bash
        env:
          PLUMB_SUITE_PLAN_DIGEST: ${{ needs.resolve.outputs.suite_digest }}
          PLUMB_SUITE_PLATFORM: ${{ matrix.platform }}
        run: python -B control/.github/scripts/suite.py work --plan suite-plan/plan.json --digest "$PLUMB_SUITE_PLAN_DIGEST" --platform "$PLUMB_SUITE_PLATFORM" --output suite-handoff
      - uses: actions/upload-artifact@v4
        with:
          name: source-suite-${{ matrix.platform }}-${{ github.run_attempt }}
          path: suite-handoff/
          if-no-files-found: error
          retention-days: 30

  source-collect:
    needs: [resolve, source-suite]
    if: needs.resolve.outputs.mode == 'source' && needs.source-suite.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
      PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
      PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
      PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
      PLUMB_SUITE_SOURCE: ${{ inputs.source }}
      PLUMB_SUITE_DECLARATION: ${{ inputs.declaration }}
      PLUMB_SUITE_PLAN_DIGEST: ${{ needs.resolve.outputs.suite_digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.suite_artifact }}
          path: suite-plan
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: source-suite-*-${{ github.run_attempt }}
          path: suite-artifacts
      - name: Independently verify jobs and collect blob completion
        id: receipt
        run: python3 -B control/.github/scripts/suite.py collect --plan suite-plan/plan.json --digest "$PLUMB_SUITE_PLAN_DIGEST" --artifacts suite-artifacts --output suite-receipt
      - uses: actions/upload-artifact@v4
        with:
          name: source-suite-receipt-${{ github.run_attempt }}
          path: suite-receipt/receipt.json
          if-no-files-found: error
          retention-days: 90

  resolve:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
      PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
      PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
      PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      suite_matrix: ${{ steps.suite.outputs.matrix }}
      suite_digest: ${{ steps.suite.outputs.digest }}
      suite_artifact: ${{ steps.bundle.outputs.artifact-id }}
      produce: ${{ steps.plan.outputs.produce }}
      produce_needed: ${{ steps.plan.outputs.produce_needed }}
      bind: ${{ steps.plan.outputs.bind }}
      bind_needed: ${{ steps.plan.outputs.bind_needed }}
      publish: ${{ steps.plan.outputs.publish }}
      publish_needed: ${{ steps.plan.outputs.publish_needed }}
      complete: ${{ steps.plan.outputs.complete }}
      complete_needed: ${{ steps.plan.outputs.complete_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}
      - id: select
        env:
          PLUMB_INPUT_SOURCE: ${{ inputs.source }}
          PLUMB_INPUT_DECLARATION: ${{ inputs.declaration }}
          PLUMB_INPUT_MARKER: ${{ inputs.marker }}
          PLUMB_INPUT_PLUMB: ${{ inputs.plumb }}
          PLUMB_INPUT_REPOSITORY: ${{ inputs.repository }}
        run: python3 -B .plumb-atom/.github/scripts/dispatch_mode.py
      - uses: actions/checkout@v6
        if: steps.select.outputs.mode == 'ship'
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          path: product
          token: ${{ github.token }}

      - name: Cold plan without Plumb
        id: plan
        if: steps.select.outputs.mode == 'ship'
        run: python3 .plumb-atom/.github/scripts/dispatch.py --root product --control .plumb-atom
      - uses: actions/checkout@v6
        if: steps.select.outputs.mode == 'source'
        with:
          repository: PerishLab/plumb
          ref: ${{ inputs.source }}
          path: candidate
          persist-credentials: false
      - id: suite
        if: steps.select.outputs.mode == 'source'
        env:
          PLUMB_SUITE_SOURCE: ${{ inputs.source }}
          PLUMB_SUITE_DECLARATION: ${{ inputs.declaration }}
        run: python3 -B .plumb-atom/.github/scripts/suite.py plan --control .plumb-atom --output suite-plan
      - uses: actions/upload-artifact@v4
        id: bundle
        if: steps.select.outputs.mode == 'source'
        with:
          name: source-suite-plan-${{ github.run_attempt }}
          path: suite-plan/plan.json
          if-no-files-found: error
          retention-days: 30

  produce:
    env:
      GH_TOKEN: ${{ github.token }}
      PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
      PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
      PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
      PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
    needs: [resolve]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.produce_needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.produce) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: bash .plumb-atom/.github/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: .plumb-atom/.github/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job produce --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job produce --node ''${{ matrix.node }}'' --execute'

  bind:
    env:
      GH_TOKEN: ${{ github.token }}
      PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
      PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
      PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
      PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
    needs: [resolve, produce]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.bind_needed == 'true' && (needs.produce.result == 'success' || needs.produce.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.bind) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: bash .plumb-atom/.github/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: .plumb-atom/.github/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job bind --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job bind --node ''${{ matrix.node }}'' --execute'

  publish:
    permissions:
      contents: read
      packages: write
    needs: [resolve, produce, bind]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.publish_needed == 'true' && (needs.produce.result == 'success' || needs.produce.result == 'skipped') && (needs.bind.result == 'success' || needs.bind.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.publish) }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
      PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
      PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
      PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
      PLUMB_RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      PLUMB_SITE_TOKEN: ${{ secrets.PLUMB_SITE_TOKEN }}
      PLUMB_PUBLISH_ACCESS: ${{ secrets.SHIP_PUBLISH_S3_ACCESS_KEY }}
      PLUMB_PUBLISH_SECRET: ${{ secrets.SHIP_PUBLISH_S3_SECRET_KEY }}
      PLUMB_PUBLISH_ENDPOINT: ${{ secrets.SHIP_PUBLISH_S3_ENDPOINT }}
      PLUMB_PUBLISH_FINGERPRINT: ${{ secrets.SHIP_PUBLISH_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: bash .plumb-atom/.github/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: .plumb-atom/.github/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job publish --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job publish --node ''${{ matrix.node }}'' --execute'

  complete:
    needs: [resolve, produce, bind, publish]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.complete_needed == 'true' && (needs.produce.result == 'success' || needs.produce.result == 'skipped') && (needs.bind.result == 'success' || needs.bind.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.complete) }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      PLUMB_WORKFLOW_INVENTORY_ACCESS: ${{ secrets.WORKFLOW_INVENTORY_S3_ACCESS_KEY }}
      PLUMB_WORKFLOW_INVENTORY_SECRET: ${{ secrets.WORKFLOW_INVENTORY_S3_SECRET_KEY }}
      PLUMB_WORKFLOW_INVENTORY_BUCKET: ${{ secrets.WORKFLOW_INVENTORY_S3_BUCKET }}
      PLUMB_WORKFLOW_INVENTORY_ENDPOINT: ${{ secrets.WORKFLOW_INVENTORY_S3_ENDPOINT }}
      PLUMB_RELEASE_REGISTRY_TOKEN: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
      PLUMB_SITE_TOKEN: ${{ secrets.PLUMB_SITE_TOKEN }}
      PLUMB_PUBLISH_ACCESS: ${{ secrets.SHIP_PUBLISH_S3_ACCESS_KEY }}
      PLUMB_PUBLISH_SECRET: ${{ secrets.SHIP_PUBLISH_S3_SECRET_KEY }}
      PLUMB_PUBLISH_ENDPOINT: ${{ secrets.SHIP_PUBLISH_S3_ENDPOINT }}
      PLUMB_PUBLISH_FINGERPRINT: ${{ secrets.SHIP_PUBLISH_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.marker }}
          token: ${{ github.token }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .plumb-atom
          token: ${{ github.token }}

      - name: Fetch marker evidence
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: bash .plumb-atom/.github/scripts/fetch-marker.sh "$PLUMB_RELEASE_MARKER"

      - name: Fetch marker evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUMB_CHECKOUT_TOKEN: ${{ github.token }}
        run: .plumb-atom/.github/scripts/fetch-marker.ps1 "$env:PLUMB_RELEASE_MARKER"

      - name: Execute only unresolved declared work
        if: runner.os != 'Windows'
        run: python3 .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job complete --node '${{ matrix.node }}' --execute

      - name: Probe control interpreter on Windows
        if: runner.os == 'Windows'
        id: python
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase probe

      - name: Reuse verified Python archive
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        id: python-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Install isolated control interpreter
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true'
        shell: pwsh
        run: .plumb-atom/.github/scripts/python.ps1 -Phase install

      - name: Retain verified Python archive before business execution
        if: runner.os == 'Windows' && steps.python.outputs.needed == 'true' && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.python.outputs.archive }}
          key: ${{ steps.python.outputs.key }}

      - name: Execute only unresolved declared work on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:PLUMB_WORKFLOW_PYTHON" .plumb-atom/.github/scripts/dispatch.py --control .plumb-atom --job complete --node ''${{ matrix.node }}'' --execute'
