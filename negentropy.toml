[scan]
include = [
  "crates/**/*.rs",
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "apps/**/*.scss",
  "packages/**/*.ts",
  "packages/**/*.tsx",
  "packages/**/*.scss",
  "docs/**/*.md",
]
exclude = [
  "**/node_modules/**",
  "**/dist/**",
]

[module]
roots = [
  "apps/*/src",
  "apps/*/tests",
  "crates/*/src",
  "crates/*/tests",
  "packages/*/src",
  "packages/*/tests",
  "docs",
]

[limit]
block = 4
path = 4

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = [
  "apps/*/tests/**/*.test.ts",
  "apps/*/tests/**/*.test.tsx",
  "packages/*/tests/**/*.test.ts",
  "packages/*/tests/**/*.test.tsx",
  "crates/*/tests/**/*.rs",
]

[[grant]]
syntax = "environment"
paths = [
  "crates/lib/src/config.rs",
  "crates/macro/src/parse.rs",
  "apps/web/vite.config.ts",
  "crates/*/tests/**/*.rs",
]

[[boundary]]
paths = [
  "apps/web/vite.config.ts",
  "apps/web/vitest.config.ts",
]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
allow = ["path"]

