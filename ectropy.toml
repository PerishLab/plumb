[[boundary]]
allow = ["receiver"]
note = "Rust procedural macros must be free functions at the proc-macro crate root accepting TokenStream; these compiler entry points cannot become receiver methods or namespace statics."
paths = ["crates/macro/src/lib.rs"]

[[boundary]]
allow = ["word"]
note = "The isolated which::Sys adapter implements the upstream trait's required associated type and method names."
paths = ["crates/lib/src/runtime/execution/system.rs"]

[[boundary]]
allow = ["word"]
note = "The isolated syn::visit::Visit adapter implements the upstream trait's required method names for the lock inspection walker."
paths = ["crates/cli/src/consumption/lock/walk/visit.rs"]

[[ban]]
paths = ["apps/web/src/lib/components/**"]
syntax = "style"

[comment]
allow = false

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
    "packages/*/tests/**/*.test.cjs",
    "packages/*/tests/**/*.test.cts",
    "packages/*/tests/**/*.test.js",
    "packages/*/tests/**/*.test.jsx",
    "packages/*/tests/**/*.test.mjs",
    "packages/*/tests/**/*.test.mts",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "apps/web/vite.config.ts",
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
    "crates/lib/src/config.rs",
    "crates/lib/src/seat/mod.rs",
    "crates/macro/src/parse.rs",
    "packages/*/tests/**/*.test.cjs",
    "packages/*/tests/**/*.test.cts",
    "packages/*/tests/**/*.test.js",
    "packages/*/tests/**/*.test.jsx",
    "packages/*/tests/**/*.test.mjs",
    "packages/*/tests/**/*.test.mts",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "apps/*",
    "apps/*/src",
    "apps/*/tests",
    "crates/*/src",
    "crates/*/tests",
    "packages/*/src",
    "packages/*/tests",
]

[scan]
exclude = [
    "**/.svelte-kit/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/target/**",
]
include = [
    "apps/**/*.css",
    "apps/**/*.scss",
    "apps/**/*.svelte",
    "apps/**/*.ts",
    "crates/**/*.rs",
    "packages/**/*.cjs",
    "packages/**/*.css",
    "packages/**/*.cts",
    "packages/**/*.js",
    "packages/**/*.jsx",
    "packages/**/*.mjs",
    "packages/**/*.mts",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.tsx",
]

[word]
single = true

[[vocabulary.term]]
description = "Foreign Vite library option callback; the carrier build passes it and cannot choose its name."
name = "fileName"

[[vocabulary.term]]
description = "The native structural children carried by one external Issue snapshot."
name = "sub_issues"

[[vocabulary.term]]
description = "The native blocking predecessors carried by one external Issue snapshot."
name = "blocked_by"

[[grant]]
paths = [
    "crates/lib/src/proof/guard/authority.rs",
    "crates/macro/src/catalogue/mod.rs",
    "crates/macro/src/resource.rs",
]
syntax = "embed"

[[boundary]]
allow = ["word"]
note = "The isolated serde::de::Visitor adapter implements the upstream trait's required method names for duplicate-key JSON decoding."
paths = ["crates/lib/src/knowledge/qualification/unique.rs"]
