[[ban]]
paths = ["apps/web/src/lib/components/**"]
syntax = "style"

[[boundary]]
allow = ["path"]
note = "vite and vitest require root-level config files; the apps root becomes law only after the depot catalog can migrate atomically"
paths = [
    "apps/web/vite.config.ts",
    "apps/web/vitest.config.ts",
]

[[boundary]]
allow = ["fanout"]
note = "site has folded into ship and the inventory did not drop back under the limit, because what stands here is not one stray adaptor but a command set that has never been layered; perish.code/plumb-modules-layered retires this row"
paths = ["crates/cli/src/command"]

[[boundary]]
allow = ["fanout"]
note = "the workflow command adds one integration test peer to the established command tests"
paths = ["crates/cli/tests"]

[[boundary]]
allow = ["fanout"]
note = "the skill budget observation adds one repository shape probe to the established inventory"
paths = ["crates/cli/src/shape"]

[[boundary]]
allow = [
    "combination",
    "word",
]
note = "the one-time Plumb bootstrap contract uses explicit provenance and identity terms plus exact refusal combinations"
paths = [
    "crates/cli/src/command/release/output/generator.rs",
    "crates/cli/src/command/release/truth/record.rs",
]

[comment]
allow = false

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "crates/*/tests/**/*.rs",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "apps/web/vite.config.ts",
    "crates/*/tests/**/*.rs",
    "crates/lib/src/config.rs",
    "crates/lib/src/forgejo/settings.rs",
    "crates/lib/src/seat.rs",
    "crates/macro/src/parse.rs",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "apps/*/src",
    "apps/*/tests",
    "crates/*/src",
    "crates/*/tests",
    "packages/*/lib",
    "packages/*/src",
    "packages/*/tests",
    "skills/*",
]

[scan]
exclude = [
    "**/.svelte-kit/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/target/**",
]
include = [
    "apps/**/*.css",
    "apps/**/*.scss",
    "apps/**/*.svelte",
    "apps/**/*.ts",
    "crates/**/*.rs",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.tsx",
    "skills/**/*.md",
]

[[vocabulary.term]]
description = "A domain vocabulary report binds its scan to the exact bundled dictionary bytes."
name = "dictionary_digest"

[[vocabulary.term]]
description = "Cargo metadata names a package manifest path as one schema field."
name = "manifest_path"

[[vocabulary.term]]
description = "An authority may name a file carrying its secret instead of placing secret bytes in the environment."
name = "secret_file"

[[vocabulary.term]]
description = "The operator harness names its pending guard poll interval in milliseconds."
name = "guard_pending_ms"

[[vocabulary.term]]
description = "The operator harness names its absent guard registration poll interval in milliseconds."
name = "guard_register_ms"

[[vocabulary.term]]
description = "The operator harness names its guard deadline in milliseconds."
name = "guard_timeout_ms"

[[vocabulary.term]]
description = "The Cargo registry token is one release authority field."
name = "registry_token"

[[vocabulary.term]]
description = "The registry account is the login the token belongs to, and a path owner is not one."
name = "registry_account"

[[vocabulary.term]]
description = "The operator harness names its workflow poll interval in milliseconds."
name = "run_poll_ms"

[[vocabulary.term]]
description = "The operator harness names its workflow deadline in milliseconds."
name = "run_timeout_ms"

[[vocabulary.term]]
description = "Cargo metadata names its build target directory as one schema field."
name = "target_directory"

[word]
single = true
