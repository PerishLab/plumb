[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
rule = ["rule://cargo"]
note = "Rust members. The anchor is also the identity: a member of this seat is judged by the cargo toolchain."

[[layout.seat]]
path = "packages/*"
anchor = ["package.json"]
rule = ["rule://pnpm"]
note = "Publishable node packages."

[[layout.seat]]
path = "apps/*"
anchor = []
note = "The anchor set is undecided. codehull/apps/web and ensign/apps/web each hold one index.html and nothing else, which points at a surface not yet discussed. Until then this level is governed and its members are not judged."

[[layout.seat]]
path = "charts/*"
note = "Helm chart carriers, one per repository, named after it. Three of three across the domain."

[[layout.seat]]
path = "skills/*"
note = "Operating briefs, one per repository, named after it. Six of six. Rejudged when the skills line is decided."

[[layout.seat]]
path = "docs/CHANGELOG/*"
note = "Immutable release history, one seat per version. Retires whole when release notes move to the depot."

[[layout.seat]]
path = ".forgejo"
note = "The forge namespace. Unavoidable, and carried by all twenty one repositories."

[[layout.seat]]
path = ".cargo"
note = "The cargo namespace."

[[layout.seat]]
path = ".plumb"
note = "Plumb's own seat inside a repository. Today it carries release datum alone."

[[layout.file]]
name = ["AGENTS.md", "LICENSE", ".gitignore"]
note = "Carried by every governed repository. AGENTS.md is the one entrypoint a coding agent reads."

[[layout.file]]
name = ["plumb.toml", "ectropy.toml", "runseal.toml", "locus.toml", "sidecar.toml"]
rule = ["rule://tool"]
note = "A root <tool>.toml is legal where <tool> names a perish.code tool. That roster is hardcoded in shape/lane.rs today and holds two names."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
rule = ["rule://cargo"]
note = "Workspace anchors."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json", ".npmrc"]
rule = ["rule://pnpm"]
note = "The pnpm workspace anchors."

[[layout.file]]
name = ["Containerfile"]
note = "The image carrier the ship adaptor projects onto."

[release]
product = "plumb"
authority = "https://releases.plumb.perish.uk"
binaries = ["plumb"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = true

[release.oci]
registry = "git.perish.top"
image = "perishlab/plumb"
account = "PerishFire"

[release.chart]
registry = "git.perish.top"
chart = "perishlab/plumb"
account = "PerishFire"

[release.cargo]
registry = "perish"
packages = ["plumb-macro", "plumb"]

[release.npm]
registry = "https://git.perish.top/api/packages/PerishLab/npm/"
packages = ["@perish/plumb"]

[release.cfworker]
account = "a6776d8a453d1b84d01576245a9c4f8d"
domain = "plumb.perish.uk"

[workflow.hash.guard]
"rust" = ["suite://cargo"]
"test" = ["*"]
"web" = ["suite://pnpm"]
"ectropy" = ["ectropy.toml", "apps", "crates", "docs", "packages", "skills"]
"plumb" = ["*"]
