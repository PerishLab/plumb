
[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Rust members. The anchor is also the identity, and a cargo rule set naming what that means is owed."

[[layout.seat]]
path = "crates/cli/rules"
note = "The rules this binary carries. Each release is its own rule set; nothing is fetched."

[[layout.seat]]
path = "crates/cli/assets"
note = "Runtime manager sources and the Git guard hooks this binary carries."

[[layout.seat]]
path = "crates/cli/cookbook"
note = "Cookbook entries this binary carries."

[[layout.seat]]
path = "crates/cli/help"
note = "Long help this binary carries."

[[layout.seat]]
path = "packages/*"
anchor = ["package.json"]
note = "Publishable node packages."

[[layout.seat]]
path = "apps/*"
anchor = []
note = "The anchor set is undecided. codehull/apps/web and ensign/apps/web each hold one index.html and nothing else, which points at a surface not yet discussed. Until then this level is governed and its members are not judged."

[[layout.seat]]
path = ".cargo"
note = "The cargo namespace."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
note = "Workspace anchors. The toolchain file pins the exact Rust wharf builds with."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json", ".npmrc"]
note = "The pnpm workspace anchors."

[[layout.file]]
name = ["Containerfile"]
note = "The image carrier the ship adaptor projects onto."

[release]
product = "plumb"
authority = "https://releases.plumb.perish.uk"
binaries = ["plumb"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = true

[release.depot]
source = "https://depot.plumb.perish.uk"

[release.oci]
registry = "ghcr.io"
image = "perishlab/plumb"
account = "PerishLab"

[release.chart]
registry = "ghcr.io"
chart = "perishlab/plumb"
account = "PerishLab"

[release.cargo]
registry = "perish"
packages = ["plumb-macro", "plumb"]

[release.npm]
registry = "https://npm.pkg.github.com/"
packages = ["@perishlab/plumb"]

[release.cfworker]
account = "a6776d8a453d1b84d01576245a9c4f8d"
domain = "plumb.perish.uk"
