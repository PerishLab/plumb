# The workflow dimension's classic input suites. A suite names the paths a
# well-known toolchain reads, so a product declares intent instead of copying a
# list. Adding a path here is a change to Plumb, never one a product makes for
# itself.

[suite]
cargo = [
  ".cargo",
  "Cargo.lock",
  "Cargo.toml",
  "clippy.toml",
  "crates",
  "rust-toolchain.toml",
  "rustfmt.toml",
]

pnpm = [
  "apps",
  "biome.json",
  "package.json",
  "packages",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.json",
]

[execution.platform]
linux = "linux-x86_64"
macos = "macos-aarch64"
windows = "windows-x86_64"

[execution.pnpm]
inherit = [
  "PATH", "HOME", "USERPROFILE", "SystemRoot", "SYSTEMROOT", "WINDIR",
  "COMSPEC", "PATHEXT", "TEMP", "TMP", "TMPDIR",
  "LANG", "LC_ALL", "LC_CTYPE", "TZ", "PNPM_HOME",
]
managed = []
reject = [
  "NODE_OPTIONS", "NODE_PATH", "NODE_ENV", "NODE_EXTRA_CA_CERTS", "NODE_ICU_DATA",
  "NODE_PRESERVE_SYMLINKS", "NODE_TLS_REJECT_UNAUTHORIZED", "NODE_USE_ENV_PROXY", "NODE_USE_SYSTEM_CA",
  "NPM_CONFIG_*", "npm_config_*", "PNPM_*", "LD_PRELOAD", "DYLD_*",
]

[execution.probe]
inherit = [
  "PATH", "HOME", "USERPROFILE", "SystemRoot", "SYSTEMROOT", "WINDIR",
  "COMSPEC", "PATHEXT", "TEMP", "TMP", "TMPDIR",
  "LANG", "LC_ALL", "LC_CTYPE", "TZ", "PLUMB_HOME",
  "PLUMB_GUARD_CONFIGURATION", "PLUMB_GUARD_DEPOT", "PLUMB_GUARD_VIEW", "PLUMB_DEPOT_SNAPSHOT",
]
managed = []
reject = ["LD_PRELOAD", "DYLD_*"]

[execution.oci]
inherit = [
  "PATH", "HOME", "USERPROFILE", "SystemRoot", "SYSTEMROOT", "WINDIR",
  "COMSPEC", "PATHEXT", "TEMP", "TMP", "TMPDIR",
  "LANG", "LC_ALL", "LC_CTYPE", "TZ", "DOCKER_HOST",
]
managed = ["REGCTL_CONFIG", "DOCKER_AUTH_CONFIG"]
reject = ["DOCKER_*", "BUILDKIT_*", "BUILDX_*", "LD_PRELOAD", "DYLD_*"]

[execution.registry]
inherit = [
  "PATH", "HOME", "USERPROFILE", "SystemRoot", "SYSTEMROOT", "WINDIR",
  "COMSPEC", "PATHEXT", "TEMP", "TMP", "TMPDIR",
  "LANG", "LC_ALL", "LC_CTYPE", "TZ",
]
managed = ["REGCTL_CONFIG", "DOCKER_AUTH_CONFIG"]
reject = ["REGCTL_*", "LD_PRELOAD", "DYLD_*"]

[execution.cargo]
inherit = [
  "PATH", "HOME", "USERPROFILE", "SystemRoot", "SYSTEMROOT", "WINDIR",
  "COMSPEC", "PATHEXT", "TEMP", "TMP", "TMPDIR",
  "LANG", "LC_ALL", "LC_CTYPE", "TZ",
  "CARGO_HOME", "RUSTUP_HOME", "RUSTUP_TOOLCHAIN",
  "LD_LIBRARY_PATH", "DYLD_LIBRARY_PATH", "DYLD_FALLBACK_LIBRARY_PATH",
]
managed = [
  "CARGO", "CARGO_TARGET_DIR", "CARGO_MANIFEST_*", "CARGO_PKG_*", "CARGO_REGISTRIES_*",
  "CARGO_BIN_EXE_*", "CARGO_CFG_*", "CARGO_FEATURE_*", "CARGO_PRIMARY_PACKAGE", "CARGO_MAKEFLAGS",
  "RUST_RECURSION_COUNT", "RUSTUP_TOOLCHAIN_SOURCE",
]
reject = [
  "CARGO_*", "RUST*", "CC", "CC_*", "CXX", "CXX_*", "AR", "AR_*",
  "CFLAGS", "CFLAGS_*", "CXXFLAGS", "CXXFLAGS_*", "CPPFLAGS", "LDFLAGS",
  "CMAKE_*", "PKG_CONFIG*", "LD_PRELOAD", "LD_LIBRARY_PATH", "DYLD_*",
]

# Python blob execution declarations; expected tool worlds require runner proof.

["inputs"]

["inputs"."plumb"]

["inputs"."plumb"."binary"]
"source" = "product"
"paths" = ["Cargo.toml","Cargo.lock","crates",".cargo"]

["inputs"."plumb"."binary"."projects"]

["inputs"."plumb"."binary"."projects"."Cargo.toml"]
"format" = "toml"

["inputs"."plumb"."binary"."projects"."Cargo.toml"."set"]
"/workspace/package/version" = "0.0.0"

["inputs"."plumb"."binary"."projects"."Cargo.lock"]
"format" = "toml"

["inputs"."plumb"."binary"."projects"."Cargo.lock"."set"]
"/package/58/version" = "0.0.0"
"/package/59/version" = "0.0.0"
"/package/60/version" = "0.0.0"

["inputs"."plumb"."binary"."projects"."crates/cli/Cargo.toml"]
"format" = "toml"

["inputs"."plumb"."binary"."projects"."crates/cli/Cargo.toml"."set"]
"/dependencies/plumb/version" = "=0.0.0"

["inputs"."plumb"."binary"."projects"."crates/lib/Cargo.toml"]
"format" = "toml"

["inputs"."plumb"."binary"."projects"."crates/lib/Cargo.toml"."set"]
"/dependencies/plumb-macro/version" = "=0.0.0"

["inputs"."plumb"."ship/cargo"]
"source" = "product"
"paths" = ["Cargo.toml","Cargo.lock","crates",".cargo"]

["inputs"."plumb"."ship/cargo"."projects"]

["inputs"."plumb"."ship/cargo"."projects"."Cargo.toml"]
"format" = "toml"

["inputs"."plumb"."ship/cargo"."projects"."Cargo.toml"."set"]
"/workspace/package/version" = "0.0.0"

["inputs"."plumb"."ship/cargo"."projects"."Cargo.lock"]
"format" = "toml"

["inputs"."plumb"."ship/cargo"."projects"."Cargo.lock"."set"]
"/package/58/version" = "0.0.0"
"/package/59/version" = "0.0.0"
"/package/60/version" = "0.0.0"

["inputs"."plumb"."ship/cargo"."projects"."crates/cli/Cargo.toml"]
"format" = "toml"

["inputs"."plumb"."ship/cargo"."projects"."crates/cli/Cargo.toml"."set"]
"/dependencies/plumb/version" = "=0.0.0"

["inputs"."plumb"."ship/cargo"."projects"."crates/lib/Cargo.toml"]
"format" = "toml"

["inputs"."plumb"."ship/cargo"."projects"."crates/lib/Cargo.toml"."set"]
"/dependencies/plumb-macro/version" = "=0.0.0"

["inputs"."plumb"."ship/npm.plumb"]
"source" = "product"
"paths" = ["package.json","pnpm-lock.yaml","pnpm-workspace.yaml","packages/plumb"]

["inputs"."plumb"."ship/npm.plumb"."projects"]

["inputs"."plumb"."ship/npm.plumb"."projects"."packages/plumb/package.json"]
"format" = "json"

["inputs"."plumb"."ship/npm.plumb"."projects"."packages/plumb/package.json"."set"]
"/version" = "0.0.0"

["inputs"."plumb"."ship/cfworker"]
"source" = "product"
"paths" = ["package.json","pnpm-lock.yaml","pnpm-workspace.yaml","apps/web"]

["inputs"."plumb"."ship/chart"]
"source" = "product"
"paths" = ["charts/plumb"]

["inputs"."plumb"."ship/oci"]
"source" = "product"
"paths" = ["Containerfile"]

["implementations"]

["implementations"."produce"]
"source" = "control"
"paths" = ["crates/cli/src/command/ship","crates/cli/src/command/release","crates/cli/src/execution","crates/cli/src/catalog","crates/lib/src",".forgejo/scripts"]

["implementations"."bind"]
"source" = "control"
"paths" = ["crates/cli/src/command/ship","crates/cli/src/command/release","crates/cli/src/execution","crates/cli/src/catalog","crates/lib/src",".forgejo/scripts"]

["implementations"."package"]
"source" = "control"
"paths" = ["crates/cli/src/command/ship","crates/cli/src/command/release","crates/cli/src/execution","crates/cli/src/catalog","crates/lib/src",".forgejo/scripts"]

["implementations"."publish"]
"source" = "control"
"paths" = ["crates/cli/src/command/ship","crates/cli/src/command/release","crates/cli/src/execution","crates/cli/src/catalog","crates/lib/src",".forgejo/scripts"]

["implementations"."complete"]
"source" = "control"
"paths" = ["crates/cli/src/command/ship","crates/cli/src/command/release","crates/cli/src/execution","crates/cli/src/catalog","crates/lib/src",".forgejo/scripts"]

["controller"]

["controller"."source"]
"source" = "control"
"paths" = ["Cargo.toml","Cargo.lock","crates",".cargo"]

["controller"."implementation"]
"source" = "control"
"paths" = [".forgejo/scripts/controller.py",".forgejo/scripts/lib"]

["controller"."targets"]

["controller"."targets"."produce.linux"]
"target" = "x86_64-unknown-linux-gnu"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["controller"."targets"."produce.macos"]
"target" = "aarch64-apple-darwin"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["controller"."targets"."produce.windows"]
"target" = "x86_64-pc-windows-msvc"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["controller"."targets"."bind.linux"]
"target" = "x86_64-unknown-linux-gnu"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["controller"."targets"."bind.macos"]
"target" = "aarch64-apple-darwin"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["controller"."targets"."bind.windows"]
"target" = "x86_64-pc-windows-msvc"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["controller"."targets"."publish"]
"target" = "x86_64-unknown-linux-gnu"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["controller"."targets"."complete"]
"target" = "x86_64-unknown-linux-gnu"
"rustc" = "rustc 1.96.1 (31fca3adb 2026-06-26)"
"cargo" = "cargo 1.96.1 (356927216 2026-06-26)"

["backend"]
"schema" = "plumb.blob-backend/v1"

[["backend"."jobs"]]
"id" = "produce"
"needs" = []
"capabilities" = ["produce.linux","produce.macos","produce.windows"]

["backend"."jobs"."runners"]
"produce.linux" = "linux"
"produce.macos" = "macos"
"produce.windows" = "windows"

[["backend"."jobs"]]
"id" = "bind"
"needs" = ["produce"]
"capabilities" = ["bind.linux","bind.macos","bind.windows"]

["backend"."jobs"."runners"]
"bind.linux" = "linux"
"bind.macos" = "macos"
"bind.windows" = "windows"

[["backend"."jobs"]]
"id" = "publish"
"needs" = ["produce","bind"]
"capabilities" = ["publish"]

["backend"."jobs"."runners"]
"publish" = "linux"

[["backend"."jobs"]]
"id" = "complete"
"needs" = ["produce","bind","publish"]
"capabilities" = ["complete"]

["backend"."jobs"."runners"]
"complete" = "linux"

["backend"."placement"]
"produce.linux" = "produce"
"controller.produce.linux" = "produce"
"produce.macos" = "produce"
"controller.produce.macos" = "produce"
"produce.windows" = "produce"
"controller.produce.windows" = "produce"
"bind.linux" = "bind"
"controller.bind.linux" = "bind"
"bind.macos" = "bind"
"controller.bind.macos" = "bind"
"bind.windows" = "bind"
"controller.bind.windows" = "bind"
"publish" = "publish"
"controller.publish" = "publish"
"complete" = "complete"
"controller.complete" = "complete"
