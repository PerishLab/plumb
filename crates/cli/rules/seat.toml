# The seat dimension: what a seat requires of the members it holds, where the
# requirement is a shape rather than a file. A seat naming one of these entries
# through `rule://seat/<name>` gets that entry's assertions applied to every
# member it holds.
#
# An entry carries `name` and `note`. `holds` names what a member's own name
# must be, `count` fixes how many members the seat may hold, and `leaf` with
# `bytes` caps a named file inside every member. All are assertions Plumb owns;
# a repository selects them and never states its own.
#
# A cap is a knob, not a verdict. It sits here rather than in the binary so
# moving it is a row edited and published, never a release.

[member]
rule = "structure.seat-member"

[[member.entry]]
name = "named-after-repository"
holds = "repository"
count = 1
note = "One member, named after the repository that carries it. Measured 2026-08-20: charts three of three, skills six of six. This is the shape structure.anchor-unique and structure.package-directory-name each hardcode for one seat."

[[member.entry]]
name = "version-named"
holds = "version"
note = "Every member names a released version. docs/CHANGELOG alone, where shape/changelog.rs holds the same assertion for one path."

[[member.entry]]
name = "wayfinder"
leaf = "SKILL.md"
bytes = 3072
note = "A brief is the minimal authoritative wayfinding a coding agent reads, not prose a person skims. It states what the tool is, when it is silent, and which authority answers what; it never restates a surface that answers for itself. Three kilobytes is where four of the six briefs in this domain already sit, so the cap holds the shape that was found rather than one that was imposed."

[[member.entry]]
name = "affirmed"
leaf = "SKILL.md"
affirms = ["declaration", "seat", "lane"]
note = "A brief points at authorities, so it goes stale when an authority moves and not when a byte moves. The affirmation is taken over the faces named here rather than over the source tree, and which faces those are is the adjustable part: measured 2026-08-21, a source-tree trigger fired nineteen times in thirty commits where four moved anything a wayfinder points at. Add a face when something a brief relies on starts moving without waking anyone. Applied to a seat it affirms the named leaf of every member; applied to a file group it affirms every file the group names."
