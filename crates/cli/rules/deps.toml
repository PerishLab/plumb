# The deps dimension's first-party policy. The authorities are compiled; their
# live stable versions are not. Retired names must migrate to their replacement.

blacklist = [
  "@compiled/react",
  "@emotion/css",
  "@emotion/react",
  "@emotion/styled",
  "@linaria/core",
  "@linaria/react",
  "@stylexjs/stylex",
  "@vanilla-extract/css",
  "goober",
  "jss",
  "styled-components",
  "styled-jsx",
]

[[retired]]
name = "@perish/harness"
use = "@perish/sealkit"

[stable.jsr]
scope = "@perish"
authority = "https://jsr.io"

[stable.cargo]
registry = "perish"
index = "sparse+https://git.perish.top/api/packages/PerishLab/cargo/"
