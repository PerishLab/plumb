# The deps dimension's self-built policy. Self-built packages live under this
# scope and track latest-stable — a version-pinned specifier is out of true.
# Retired names must migrate to their replacement.

scope = "@perish"

blacklist = [
  "@compiled/react",
  "@emotion/css",
  "@emotion/react",
  "@emotion/styled",
  "@linaria/core",
  "@linaria/react",
  "@stylexjs/stylex",
  "@vanilla-extract/css",
  "goober",
  "jss",
  "styled-components",
  "styled-jsx",
]

[[retired]]
name = "@perish/harness"
use = "@perish/sealkit"
