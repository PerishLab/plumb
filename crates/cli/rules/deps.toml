# The deps dimension's first-party policy. The authorities are compiled; their
# live stable versions are not.

blacklist = [
  "@compiled/react",
  "@emotion/css",
  "@emotion/react",
  "@emotion/styled",
  "@linaria/core",
  "@linaria/react",
  "@stylexjs/stylex",
  "@vanilla-extract/css",
  "goober",
  "jss",
  "styled-components",
  "styled-jsx",
]

[stable.cargo]
registry = "perish"
index = "sparse+https://git.perish.top/api/packages/PerishLab/cargo/"
