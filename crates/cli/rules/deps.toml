# The deps dimension's self-built policy. Self-built packages live under this
# scope and track latest-stable unless a support line is declared here.
# Retired names must migrate to their replacement.

scope = "@perish"

blacklist = [
  "@compiled/react",
  "@emotion/css",
  "@emotion/react",
  "@emotion/styled",
  "@linaria/core",
  "@linaria/react",
  "@stylexjs/stylex",
  "@vanilla-extract/css",
  "goober",
  "jss",
  "styled-components",
  "styled-jsx",
]

[[retired]]
name = "@perish/harness"
use = "@perish/sealkit"

[[support]]
name = "@perish/sealkit"
requirement = "^0.3.1"
minimum = "0.3.1"
legacy = "^0.2.1"
line = "0.2"
