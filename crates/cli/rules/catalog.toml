tags = ["configuration"]

[[rule]]
id = "template.variables-owned-by-product"
summary = "Products own template variables"
law = "The substrate owns template grammar while each caller owns the variables it supplies."
evidence = "Manifest documentation and the variable table passed to fill."
standing = "prose-only"
owner = "product"
tags = ["configuration", "ownership"]
