[[rule]]
id = "release.stable-rejoin"
summary = "Stable settles back into main"
law = "After stable activation a topology-preserving merge makes its published commit an ancestor of main before another stable activation; exact release and ordinary main movement remain independent."
evidence = "The highest stable marker's commit against main's ancestry: release rejoin settles it with a topology-only merge carrying main's Guard proof, Doctor notes a stable marker main does not yet hold, and release stamp and ship dispatch refuse any later marker until the remote main holds it."
standing = "mechanized"
owner = "release"
tags = ["ownership", "release", "state"]

[[rule]]
id = "release.marker-distributed"
summary = "A marker counts as distributed only by its distribution record"
law = "Wharf's distribution.json beside a marker's seal is the one authority on how far the marker is distributed: a prerelease promotes only once it records the prerelease complete at the commit being promoted, and a later marker waits until it records the stable below complete at that stable's commit. Seals, channel pointers and registries are evidence; drift is settled by dispatching the marker again."
evidence = "The release authority's v1/releases/<channel>/<marker>/distribution.json: release stamp reads it for the prerelease a stable marker promotes, and release owed, open, stamp and ship dispatch read it for the highest stable below the marker at hand."
standing = "mechanized"
owner = "release"
tags = ["release", "state"]

[[rule]]
id = "release.line-closed"
summary = "A released line is closed"
law = "Once its stable marker ships and main holds it, a release line is deleted; the marker keeps its history, and a line that never reached stable closes only as abandoned."
evidence = "The remote heads against the highest stable marker below the marker at hand: release close deletes a line whose head is its stable commit, release stamp and ship dispatch refuse while the line still stands, and release open refuses to reopen a version that stands as stable."
standing = "mechanized"
owner = "release"
tags = ["release", "state"]

[[rule]]
id = "release.stable-lodged"
summary = "Stable lodges its changelog and skill on Depot"
law = "A stable marker's changelog, and its skill where the product declares one, stand as generations on the product's Depot before another marker of that product is stamped or dispatched."
evidence = "The standing Depot generation of the highest stable marker below the marker at hand: release stamp and ship dispatch refuse while one is missing, and depot consign lodges it through wharf's yard and reads it back."
standing = "mechanized"
owner = "release"
tags = ["release", "state"]

