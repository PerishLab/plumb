# Every rule the catalogue holds, and nothing about how any of them is judged.
#
# A rule is two things that were fused: what it says, and what computes it. The
# text -- what is required, of whom, and what evidence answers it -- is carried
# here. The mechanism stays in the binary, bound to the text by `id` alone, so
# eighty rules that are checked by code and forty-one that are checked by a
# reader are held the same way and read the same way.
#
# Carried, so a wording, an owner, a tag, or a whole new rule is one depot
# publish, scoped to a channel and reversible. Changing what a rule *computes*
# is still a release, and should be.
#
# `id` is `namespace.name`, both canonical tokens, and it is the only thing any
# other record may point at. `owner` and every `tags` entry name taxonomy ids.
# `standing` is `mechanized` when code computes it, `prose-only` when a reader
# judges it, and `observed` when Plumb reports what it sees without ruling.
#
# A carried catalogue that does not name every mechanism the running binary
# holds is not used at all: the compiled text is read instead, whole. A partial
# catalogue is worse than an old one, because the rule that goes missing is the
# one nobody notices until it fires.

