law = "Every top-level directory sits in a declared seat, or has a shadow in the skeleton where no layout is declared."
evidence = "Repository top-level directory names against the declared layout, or against the released name sets where none is declared."
standing = "mechanized"
owner = "plumb"
tags = ["repository"]

[[rule]]
id = "structure.known-file"
summary = "Root files have a known role"
