evidence = "The product's data-home layout."
standing = "prose-only"
owner = "product"
tags = ["state"]

[[rule]]
id = "state.records-written-whole"
summary = "State records are replaced atomically"
law = "A state write lands beside the target and replaces it whole."
evidence = "Every durable state write path."
standing = "prose-only"
owner = "product"
tags = ["state"]

[[rule]]
id = "structure.canonical-branch-protection"
summary = "Managed repositories share branch protection"
law = "Every Plumb-managed repository carries byte-identical main and release/** baseline rules; exact release rules follow only PREPARING or FROZEN state, and settled release branches remain frozen."
evidence = "Forgejo branch-protection responses projected onto the canonical skill documents, existing release branches, and stable consensus."
standing = "prose-only"
owner = "plumb"
tags = ["release", "repository", "state"]

[[rule]]
id = "structure.transitional-wrappers-observed"
summary = "Transitional wrappers remain visible"
law = "Repository-authored wrappers are transitional or product-specific observations, not a required generic lifecycle inventory."
evidence = "Wrapper names below .runseal/wrappers in Doctor's positive shape snapshot."
standing = "observed"
owner = "plumb"
tags = ["adoption", "repository"]

[[rule]]
id = "template.manifest-variables-aligned"
summary = "Manifest variables match product vocabulary"
law = "A manifest spells every injected environment key exactly as the target product derives it."
evidence = "Manifest templates compared with the target's cascade vocabulary."
standing = "prose-only"
