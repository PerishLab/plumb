# The path sets ectropy scans, each named so a shape can select it rather than
# carry a copy. A set asserts nothing on its own; suites/shape.toml says which
# repository shape earns which set.

addressed = true

rule = "structure.ectropy-policy"

[[set]]
name = "crates-rust"
include = [
  "crates/**/*.rs",
]
exclude = [
  "**/target/**",
]
roots = [
  "crates/*/src",
  "crates/*/tests",
]
tests = [
  "crates/*/src/**/*.rs",
  "crates/*/tests/**/*.rs",
]
environment = [
  "crates/*/tests/**/*.rs",
]

[[set]]
name = "crates-ts"
include = [
  "crates/**/*.ts",
  "crates/**/*.tsx",
]
exclude = [
  "**/target/**",
  "**/node_modules/**",
]
roots = [
  "crates/*/src",
  "crates/*/tests",
]
# Each crate directory holding TypeScript outside src/tests is its own root.
derive = [
  "crates/*",
]

[[set]]
name = "app-rust"
include = [
  "app/src/**/*.rs",
  "app/tests/**/*.rs",
]
exclude = [
  "**/target/**",
]
roots = [
  "app/src",
  "app/tests",
]
tests = [
  "app/tests/**/*.rs",
]

[[set]]
name = "tools-rust"
include = [
  "tools/**/*.rs",
]
exclude = [
  "**/target/**",
]
roots = [
  "tools/*/src",
  "tools/*/tests",
]
tests = [
  "tools/*/src/**/*.rs",
  "tools/*/tests/**/*.rs",
]
environment = [
  "tools/*/tests/**/*.rs",
]

# A tool's resources/ is the data it reads at run time, so it is excluded, not read.
[[set]]
name = "tools-js"
include = [
  "tools/**/*.cjs",
  "tools/**/*.cts",
  "tools/**/*.js",
  "tools/**/*.jsx",
  "tools/**/*.mjs",
  "tools/**/*.mts",
]
exclude = [
  "**/target/**",
  "**/node_modules/**",
  "tools/*/resources/**",
]
roots = [
  "tools/*",
  "tools/*/src",
  "tools/*/tests",
]

[[set]]
name = "runseal-scripts"
include = [
  ".runseal/**",
]
roots = [
  ".runseal",
]

[[set]]
name = "lib-ts"
include = [
  "lib/**/*.ts",
  "lib/**/*.tsx",
]
exclude = [
  "**/node_modules/**",
]
roots = [
  "lib",
]

[[set]]
name = "tests-ts"
include = [
  "tests/**/*.ts",
  "tests/**/*.tsx",
]
roots = [
  "tests",
]
tests = [
  "tests/**/*.test.ts",
  "tests/**/*.test.tsx",
]

[[set]]
name = "docs-md"
include = [
  "docs/**/*.md",
]
roots = [
  "docs",
]

[[set]]
name = "web-components-banned"
bans = [
  "apps/web/src/lib/components/**",
]

[[set]]
name = "apps-web"
include = [
  "apps/**/*.ts",
  "apps/**/*.css",
  "apps/**/*.scss",
]
exclude = [
  "**/node_modules/**",
  "**/dist/**",
]
roots = [
  "apps/*",
  "apps/*/src",
  "apps/*/tests",
]
tests = [
  "apps/*/tests/**/*.test.ts",
]

[[set]]
name = "apps-web-svelte"
include = [
  "apps/**/*.svelte",
]
exclude = [
  "**/.svelte-kit/**",
]

[[set]]
name = "apps-web-tsx"
include = [
  "apps/**/*.tsx",
]
tests = [
  "apps/*/tests/**/*.test.tsx",
]

[[set]]
name = "apps-web-js"
include = [
  "apps/**/*.cjs",
  "apps/**/*.cts",
  "apps/**/*.js",
  "apps/**/*.jsx",
  "apps/**/*.mjs",
  "apps/**/*.mts",
]
tests = [
  "apps/*/tests/**/*.test.cjs",
  "apps/*/tests/**/*.test.cts",
  "apps/*/tests/**/*.test.js",
  "apps/*/tests/**/*.test.jsx",
  "apps/*/tests/**/*.test.mjs",
  "apps/*/tests/**/*.test.mts",
]

[[set]]
name = "packages-web"
include = [
  "packages/**/*.ts",
  "packages/**/*.css",
  "packages/**/*.scss",
]
exclude = [
  "**/node_modules/**",
  "**/dist/**",
]
roots = [
  "packages/*/lib",
  "packages/*/src",
  "packages/*/tests",
]
tests = [
  "packages/*/tests/**/*.test.ts",
]

[[set]]
name = "packages-web-svelte"
include = [
  "packages/**/*.svelte",
]
exclude = [
  "**/.svelte-kit/**",
]

[[set]]
name = "packages-web-tsx"
include = [
  "packages/**/*.tsx",
]
tests = [
  "packages/*/tests/**/*.test.tsx",
]

[[set]]
name = "packages-web-js"
include = [
  "packages/**/*.cjs",
  "packages/**/*.cts",
  "packages/**/*.js",
  "packages/**/*.jsx",
  "packages/**/*.mjs",
  "packages/**/*.mts",
]
tests = [
  "packages/*/tests/**/*.test.cjs",
  "packages/*/tests/**/*.test.cts",
  "packages/*/tests/**/*.test.js",
  "packages/*/tests/**/*.test.jsx",
  "packages/*/tests/**/*.test.mjs",
  "packages/*/tests/**/*.test.mts",
]
