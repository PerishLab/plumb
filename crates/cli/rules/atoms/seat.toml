# The seat dimension: what a seat requires of the members it holds, where the
# requirement is a shape rather than a file. A seat naming one of these entries
# through `rule://seat/<name>` gets that entry's assertions applied to every
# member it holds.
#
# An entry carries `name` and `note`. `holds` names what a member's own name
# must be, `count` fixes how many members the seat may hold, and `leaf` with
# `bytes` caps a named file inside every member. All are assertions Plumb owns;
# a repository selects them and never states its own.
#
# A cap is a knob, not a verdict. It sits here rather than in the binary so
# moving it is a row edited and published, never a release.

addressed = true

[member]
rule = "structure.seat-member"

[[member.entry]]
name = "docker-client"
kind = "retired"
note = "Selected by the OCI production profiles that governed codehull and ensign; no governed repository declares an image seat today. A production repository naming this rule revives it."
[[member.entry.probe]]
platform = ["linux-x86_64"]
argv = ["docker", "version", "--format", "{{.Client.Version}}"]
stdout = "29.6.1"

[[member.entry]]
name = "docker-engine"
kind = "retired"
note = "Selected by the OCI production profiles; revived by the first governed repository that builds an image."
[[member.entry.probe]]
platform = ["linux-x86_64"]
argv = ["docker", "version", "--format", "{{.Server.Version}}"]
stdout = "29.6.1"

[[member.entry]]
name = "docker-buildx"
kind = "retired"
note = "Selected by the OCI production profiles; revived with the Docker build frontend it names."
[[member.entry.probe]]
platform = ["linux-x86_64"]
argv = ["docker", "buildx", "version"]
stdout = "github.com/docker/buildx v0.35.0 a319e5b15052cf6557ceb666eb8ff6e32380b782"

[[member.entry]]
name = "regctl"
kind = "retired"
note = "Selected by the OCI publication profiles; revived by the first governed repository that publishes archive-native images."
[[member.entry.probe]]
platform = ["linux-x86_64"]
argv = ["regctl", "version", "--format", "{{.VCSTag}}"]
stdout = "v0.11.6"

[[member.entry]]
name = "rust-roles"
kind = "retired"
allow = ["cli", "api", "lib"]
note = "Selected by the runseal profile before profiles retired; revived by a Rust repository that adopts the roster the domain exercised."

[[member.entry]]
name = "rust-ignore"
kind = "retired"
note = "Selected by the runseal profile before profiles retired; revived by a Rust-only repository adopting the conventional ignore policy."
[member.entry.lines]
allow = ["/.task/", "/.local/", "target/"]
required = ["/.task/", "/.local/", "target/"]

[[member.entry]]
name = "text-attributes"
kind = "retired"
note = "Selected by the runseal profile before profiles retired; revived by a repository declaring the domain line-ending convention."
[member.entry.lines]
allow = ["* text=auto eol=lf", "*.ps1 text eol=crlf"]
required = ["* text=auto eol=lf"]

[[member.entry]]
name = "named-after-repository"
holds = "repository"
most = 1
note = "At most one member, named after the repository that carries it. A seat admits and never demands: a repository with no chart or no skill owes no member and no tombstone, and one that has a member holds it to this name. Measured 2026-08-20: charts three of three. This is the shape structure.anchor-unique and structure.package-directory-name each hardcode for one seat."

[[member.entry]]
name = "wayfinder"
kind = "retired"
leaf = "SKILL.md"
bytes = 3072
note = "No seat selects it since skills/* retired to Depot: plumb depot consign --kind skill holds the brief it is handed to this cap, and a layout naming the rule revives it. A brief is the minimal authoritative wayfinding a coding agent reads, not prose a person skims. It states what the tool is, when it is silent, and which authority answers what; it never restates a surface that answers for itself. Three kilobytes is where four of the six briefs in this domain already sit, so the cap holds the shape that was found rather than one that was imposed."

[[member.entry]]
name = "affirmed"
leaf = "SKILL.md"
affirms = ["declaration", "seat", "lane"]
note = "A brief points at authorities, so it goes stale when an authority moves and not when a byte moves. The affirmation is taken over the faces named here rather than over the source tree, and which faces those are is the adjustable part: measured 2026-08-21, a source-tree trigger fired nineteen times in thirty commits where four moved anything a wayfinder points at. Add a face when something a brief relies on starts moving without waking anyone. Applied to a seat it affirms the named leaf of every member; applied to a file group it affirms every file the group names."
