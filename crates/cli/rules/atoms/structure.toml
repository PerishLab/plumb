# The structure dimension's membership sets. Repaying an unknown-shape debt is a
# row added here, not a function rewritten. Whitelists of legal names; a name in
# none of them is unknown shape.
#
# A member carries `name` and `note`. The note is data, not a comment, so
# `plumb rule show` can print why a name is permitted; a member nobody can
# justify has no note to write and does not belong here. A name that stops
# being legal is deleted; the commit that deletes it says why.
#
# Exercise counts below were measured across the nineteen governed, unarchived
# repositories on GitHub main on 2026-09-28. They are evidence, not law:
# re-measure before trusting them.

[dir]
rule = "structure.known-directory"

[[dir.member]]
name = "apps"
note = "Deployable applications. codehull, design, ensign, noema, plumb, stim."

[[dir.member]]
name = "charts"
note = "Helm chart carriers the ship adaptors project onto. codehull, ensign, noema, plumb."

[[dir.member]]
name = "clusters"
note = "Cluster declarations. manifests."

[[dir.member]]
name = "crates"
note = "Rust members. Fifteen governed repositories; the most exercised seat here."

[[dir.member]]
name = "deploy"
note = "Deployment substrate outside the application. codehull, ensign, noema."

[[dir.member]]
name = "examples"
note = "Runnable specimens beside the product. sidecar."

[[dir.member]]
name = "hosts"
note = "Host declarations. hardrig."

[[dir.member]]
name = "packages"
note = "Publishable node packages. crest, design, plumb, sidecar."
