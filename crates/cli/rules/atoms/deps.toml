# The deps dimension's first-party policy: the styling packages a governed
# repository does not carry, and the .env loaders that would let settings
# bypass Cascade.

rule = "deps.styling-package-allowed"

blacklist = [
  "@compiled/react",
  "@emotion/css",
  "@emotion/react",
  "@emotion/styled",
  "@linaria/core",
  "@linaria/react",
  "@stylexjs/stylex",
  "@vanilla-extract/css",
  "goober",
  "jss",
  "styled-components",
  "styled-jsx",
]

[loader]
rule = "deps.environment-loader-absent"
refused = ["dotenv", "dotenvy"]
