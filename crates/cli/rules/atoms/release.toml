# The release dimension's managed numbers. A cap here is Plumb's law: widening
# one is a change to Plumb, never a declaration a product can make for itself.
# `ceiling` is the width every attachment shares, and `permitted` carries only
# the attachments that depart from it. `product.<ns>` carries the widths one
# product departs by, named after its `[identity] ns`, which must equal its
# repository name; a product never declares its own width. What the family has
# actually released is derived from complete stable distribution records and
# the released plumb.toml, not a number carried here.

rule = "release.attachment-permitted"

ceiling = 10

[permitted]
cargo = 13

[product.radicula]
cargo = 30
