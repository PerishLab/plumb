# The six dimensions ectropy measures a repository against. Every governed
# repository renders the same numbers, so a repository never sets them; plumb
# writes them into ectropy.toml and judges what it finds there against this
# file.
#
# These are carried, not compiled. A limit is a number that will move: it is
# argued about, it is measured again, and one repository's transition should
# never cost the estate a binary release. Held here, a change to a limit is one
# depot publish, scoped to a channel, and reversible. Before this file existed
# the same six numbers were written twice inside the binary and nothing
# compared the copies.
#
# A repository that cannot meet a limit does not raise it. It states a
# [[boundary]] naming the paths and the reason, and the note says which task
# retires the row. A limit with no retirement condition stops being a limit.

[limit]
# Nested blocks inside one function body.
block = 4
# Entries directly inside one scanned directory. Hitting it means a layer is
# missing, not that the layer is full.
fanout = 10
# Lines in one file.
file = 300
# Nesting depth of markup elements.
markup = 8
# Parameters on one function.
param = 4
# Directory levels below a module root.
path = 4
