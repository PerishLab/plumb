# The structure dimension's membership sets. Repaying an unknown-shape debt is a
# row added here, not a function rewritten. Whitelists of legal names; a name in
# none of them is unknown shape.

dirs = ["apps", "charts", "crates", "docs", "lib", "packages", "tests"]
wrappers = ["guard", "init", "land", "release", "ship", "bake"]
required = ["guard", "init", "land"]
hooks = ["pre-commit", "commit-msg"]
lanes = ["guard", "release-beta", "release-stable", "probe"]
