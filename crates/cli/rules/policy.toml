# The ectropy policy Plumb renders for a repository. Constant sections live at
# the top; conditional rows below name the text earned by a repository's shape.
#
# plumb renders these sections into ectropy.toml and judges what it finds there
# against this same file, so there is one source and no pair of copies to drift
# apart. Before this file existed the numbers were written twice inside the
# binary and nothing compared them.
#
# Carried, so changing any of it is one depot configuration projection, scoped to a channel and
# reversible, instead of a release and an estate upgrade. A repository that
# cannot meet a limit does not raise it: it states a [[boundary]] naming the
# paths and the reason, and the note says which task retires the row. A limit
# with no retirement condition stops being a limit.

[limit]
# Nested blocks inside one function body.
block = 4
# Entries directly inside one scanned directory. Hitting it means a layer is
# missing, not that the layer is full.
fanout = 10
# Lines in one file.
file = 300
# Nesting depth of markup elements.
markup = 8
# Parameters on one function.
param = 4
# Directory levels below a module root.
path = 3

[comment]
# Code says what it does by being read. A comment that explains it is a second
# statement of the same thing, free to drift from the first.
allow = false

[word]
# One identifier, one word. A compound name is usually two responsibilities that
# have not been separated yet.
single = true

# Every predicate is the presence of all named directories. Repeating one
# output is harmless because the renderer holds sets; keeping each row local to
# its trigger makes the carried shape readable without a second expression
# language.

[[shape]]
when = ["crates"]
include = ["crates/**/*.rs"]
exclude = ["**/target/**"]
roots = ["crates/*/src", "crates/*/tests"]
tests = ["crates/*/tests/**/*.rs"]

[[shape]]
when = ["app"]
include = ["app/src/**/*.rs", "app/tests/**/*.rs"]
exclude = ["**/target/**"]
roots = ["app/src", "app/tests"]
tests = ["app/tests/**/*.rs"]

[[shape]]
when = ["app", ".runseal"]
include = [".runseal/**"]
roots = [".runseal"]

[[shape]]
when = ["lib"]
include = ["lib/**/*.ts", "lib/**/*.tsx"]
exclude = ["**/node_modules/**"]
roots = ["lib"]

[[shape]]
when = ["tests"]
include = ["tests/**/*.ts", "tests/**/*.tsx"]
roots = ["tests"]
tests = ["tests/**/*.test.ts", "tests/**/*.test.tsx"]

[[shape]]
when = ["docs"]
include = ["docs/**/*.md"]
roots = ["docs"]

[[shape]]
when = ["skills"]
include = ["skills/**/*.md"]
roots = ["skills/*"]

[[shape]]
when = ["apps/web/src/lib/components"]
bans = ["apps/web/src/lib/components/**"]

# Web seats share one mechanism: Svelte is included only when present, and TSX
# is included unless the seat is Svelte-only. The mechanism detects extensions;
# every path it can emit is carried here.

[[web]]
seat = "apps"
include = ["apps/**/*.ts", "apps/**/*.css", "apps/**/*.scss"]
exclude = ["**/node_modules/**", "**/dist/**"]
roots = ["apps/*", "apps/*/src", "apps/*/tests"]
tests = ["apps/*/tests/**/*.test.ts"]
svelte-include = ["apps/**/*.svelte"]
svelte-exclude = ["**/.svelte-kit/**"]
tsx-include = ["apps/**/*.tsx"]
tsx-tests = ["apps/*/tests/**/*.test.tsx"]

[[web]]
seat = "packages"
include = ["packages/**/*.ts", "packages/**/*.css", "packages/**/*.scss"]
exclude = ["**/node_modules/**", "**/dist/**"]
roots = ["packages/*/lib", "packages/*/src", "packages/*/tests"]
tests = ["packages/*/tests/**/*.test.ts"]
svelte-include = ["packages/**/*.svelte"]
svelte-exclude = ["**/.svelte-kit/**"]
tsx-include = ["packages/**/*.tsx"]
tsx-tests = ["packages/*/tests/**/*.test.tsx"]
