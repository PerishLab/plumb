# The words a rule may be filed under: who it is answerable to, what it is about,
# and which part of the skeleton it belongs to.
#
# Nothing here judges anything. It is the vocabulary the catalogue is written
# in, and it is carried beside the catalogue so that adding an owner, renaming a
# scope, or writing a better summary is one depot publish rather than a release.
#
# Every id is a canonical token: lowercase letters, digits, and single hyphens.
# A rule names one `owner` and one or more `tags` from this file, and its own id
# begins with a `namespace` from it. A name that resolves to nothing here is not
# a rule the catalogue can hold, so a taxonomy that fails to answer the carried
# catalogue is not used: the compiled pair is read instead, both files together.

