schema = "plumb.product-profile/v1"

[product]
name = "plumb"
authority = "https://releases.plumb.perish.uk"
depot = "https://depot.plumb.perish.uk"
derivatives = ["changelog", "skill"]

[governance]
manifest = '''

[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Rust members. The anchor is also the identity, and a cargo rule set naming what that means is owed."

[[layout.seat]]
path = "crates/cli/rules"
depot = "rules"
note = "CLI rules projected into the configuration derivative."

[[layout.seat]]
path = "crates/cli/profiles"
depot = "profiles"
note = "Digest-addressed product governance profiles and their centrally controlled migration state targets."

[[layout.seat]]
path = "crates/lib/rules"
depot = "rules"
note = "Library rules projected into the configuration derivative."

[[layout.seat]]
path = "crates/cli/assets"
depot = "assets"
note = "Runtime manager sources and Git guard hooks projected into the configuration derivative. Workflow templates are retired."

[[layout.seat]]
path = "crates/cli/cookbook"
depot = "cookbook"
note = "Cookbook entries projected into the configuration derivative."

[[layout.seat]]
path = "crates/cli/help"
depot = "help"
note = "Help entries projected into the configuration derivative."

[[layout.seat]]
path = "packages/*"
anchor = ["package.json"]
note = "Publishable node packages."

[[layout.seat]]
path = "apps/*"
anchor = []
note = "The anchor set is undecided. codehull/apps/web and ensign/apps/web each hold one index.html and nothing else, which points at a surface not yet discussed. Until then this level is governed and its members are not judged."

[[layout.seat]]
path = "charts/*"
rule = ["rule://seat/named-after-repository"]
note = "Helm chart carriers. Three of three across the domain."

[[layout.seat]]
path = "skills/*"
rule = [
  "rule://seat/named-after-repository",
  "rule://seat/wayfinder",
  "rule://seat/affirmed",
]
note = "Operating briefs. Six of six. Rejudged when the skills line is decided."

[[layout.seat]]
path = "docs/CHANGELOG/*"
kind = "retired"
note = "Release notes live in the depot; this tombstone keeps the retired source seat absent."

[[layout.seat]]
path = ".forgejo"
note = "Plumb's private canonical ship atom. Product repositories dispatch it and are forbidden from carrying this namespace."

[[layout.seat]]
path = ".cargo"
note = "The cargo namespace."

[[layout.seat]]
path = ".plumb"
note = "Plumb's own seat inside a repository. Today it carries release datum alone."

[[layout.file]]
name = ["AGENTS.md"]
rule = ["rule://seat/affirmed"]
note = "The one entrypoint a coding agent reads as authority for this repository. It is affirmed against the faces its rule names, not against the source tree."

[[layout.file]]
name = ["LICENSE", ".gitignore"]
note = "Carried by every governed repository."

[[layout.file]]
name = ["plumb.toml", "ectropy.toml", "runseal.toml", "locus.toml", "sidecar.toml"]
note = "A root <tool>.toml is legal where <tool> names a perish.code tool. That roster is hardcoded in shape/lane.rs today and holds two names; a rule naming it is owed."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Workspace anchors."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json", ".npmrc"]
note = "The pnpm workspace anchors."

[[layout.file]]
name = ["Containerfile"]
note = "The image carrier the ship adaptor projects onto."

[release]
product = "plumb"
authority = "https://releases.plumb.perish.uk"
binaries = ["plumb"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = true

[release.depot]
source = "https://depot.plumb.perish.uk"
derivatives = ["configuration", "changelog", "skill"]
validator = ["plumb", "doctor"]

[release.oci]
registry = "git.perish.top"
image = "perishlab/plumb"
account = "PerishFire"

[release.chart]
registry = "git.perish.top"
chart = "perishlab/plumb"
account = "PerishFire"

[release.cargo]
registry = "perish"
packages = ["plumb-macro", "plumb"]

[release.npm]
registry = "https://git.perish.top/api/packages/PerishLab/npm/"
packages = ["@perish/plumb"]

[release.cfworker]
account = "a6776d8a453d1b84d01576245a9c4f8d"
domain = "plumb.perish.uk"
'''
ectropy = '''
[[ban]]
paths = ["apps/web/src/lib/components/**"]
syntax = "style"

[comment]
allow = false

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "crates/*/tests/**/*.rs",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "apps/web/vite.config.ts",
    "crates/*/tests/**/*.rs",
    "crates/lib/src/config.rs",
    "crates/lib/src/forgejo/settings.rs",
    "crates/lib/src/seat/mod.rs",
    "crates/macro/src/parse.rs",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "apps/*",
    "apps/*/src",
    "apps/*/tests",
    "crates/*/src",
    "crates/*/tests",
    "packages/*/lib",
    "packages/*/src",
    "packages/*/tests",
    "skills/*",
]

[scan]
exclude = [
    "**/.svelte-kit/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/target/**",
]
include = [
    "apps/**/*.css",
    "apps/**/*.scss",
    "apps/**/*.svelte",
    "apps/**/*.ts",
    "crates/**/*.rs",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.tsx",
    "skills/**/*.md",
]

[word]
single = true
'''
