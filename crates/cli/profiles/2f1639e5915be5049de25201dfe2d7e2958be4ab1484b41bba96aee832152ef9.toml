schema = "plumb.product-profile/v1"

[product]
name = "runseal"
authority = "https://releases.runseal.perish.uk"
depot = "https://depot.runseal.perish.uk"
derivatives = ["changelog", "skill"]

[governance]
manifest = '''
[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Rust packages occupy the closed cli, api, or lib product roles."

[[layout.file]]
name = ["AGENTS.md"]
note = "The only product-specific operating entrypoint."

[[layout.file]]
name = ["LICENSE", ".gitignore", ".gitattributes"]
note = "Repository identity and Git policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[release]
product = "runseal"
authority = "https://releases.runseal.perish.uk"
binaries = ["runseal"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[release.cargo]
registry = "perish"
packages = ["runseal"]
'''
ectropy = '''
[comment]
allow = false

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "test"

[[grant]]
paths = [
    "crates/cli/src/main.rs",
    "crates/cli/src/skill.rs",
    "crates/*/tests/**/*.rs",
    "crates/lib/src/core/config.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
]

[scan]
exclude = ["**/target/**"]
include = ["crates/**/*.rs"]

[vocabulary]

[word]
single = true
'''
