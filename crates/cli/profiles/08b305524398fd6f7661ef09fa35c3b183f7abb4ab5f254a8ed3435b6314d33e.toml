schema = "plumb.product-profile/v1"

[product]
name = "ectropy"
authority = "https://releases.ectropy.perish.uk"
derivatives = ["changelog", "skill"]

[governance]
manifest = '''
[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The CLI, kernel, and grammar Rust workspace members."

[[layout.seat]]
path = "skills/*"
anchor = ["SKILL.md"]
note = "Published agent skill packages."

[[layout.seat]]
path = "docs"
note = "Admitted design and release history."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".forgejo"
note = "The canonical forge namespace."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.seat]]
path = ".plumb"
note = "Plumb-owned affirmation records."

[[layout.file]]
name = ["AGENTS.md"]
rule = ["rule://seat/affirmed"]
note = "The repository entrypoint is affirmed against its governed faces."

[[layout.file]]
name = ["LICENSE", ".gitignore", ".gitattributes"]
note = "Repository identity and Git policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[[layout.file]]
name = ["plumb.toml", "ectropy.toml", "runseal.toml"]
note = "Governance and isolated execution declarations."

[[layout.file]]
name = ["DESIGN.md"]
note = "The admitted structure-tree and adapter contract."

[release]
product = "ectropy"
authority = "https://releases.ectropy.perish.uk"
binaries = ["ectropy"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = true
'''
ectropy = '''
[[boundary]]
allow = [
    "path",
    "comment",
]
note = "release product glue is platform-specific ci infrastructure"
paths = [".forgejo/**"]

[comment]
allow = false

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "test"

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
    "docs",
    "skills/*",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
    "docs/**/*.md",
    "skills/**/*.md",
]

[vocabulary]

[word]
single = true
'''
