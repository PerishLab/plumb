[package]
name = "plumb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "plumb"
path = "src/main.rs"

[dependencies]
plumb = { path = "../lib" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.9"
