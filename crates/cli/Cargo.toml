[package]
name = "plumb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "plumb_cli"
path = "src/command/library/mod.rs"

[[bin]]
name = "plumb"
path = "src/main.rs"

[[test]]
name = "command"
path = "tests/command/mod.rs"

[[test]]
name = "guard"
path = "tests/guard/main.rs"

[[test]]
name = "operator-line"
path = "tests/operator/line/main.rs"

[[test]]
name = "operator-repository"
path = "tests/operator/repository/main.rs"

[[test]]
name = "operator-observation"
path = "tests/operator/observation/main.rs"

[[test]]
name = "repository"
path = "tests/repository/main.rs"

[dependencies]
locus = { version = "0", registry = "perish" }
plumb = { path = "../lib", features = ["observation", "radius", "skill", "vendor"] , version = "=0.0.0" }
radicula-lock = { version = "0", registry = "perish" }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
fs4 = "0.13"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
semver = "1"
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false }
syn = { version = "2", features = ["full", "visit"] }
tar = "0.4"
tempfile = "3"
toml = "0.9"
toml_edit = "0.23"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
plumb = { path = "../lib", features = ["observation", "radius", "skill", "testing", "vendor"], version = "=0.0.0" }
tempfile = "3"
