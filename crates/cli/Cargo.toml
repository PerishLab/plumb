[package]
name = "plumb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "plumb_cli"
path = "src/shape/repository/dependency/protocol.rs"

[[bin]]
name = "plumb"
path = "src/main.rs"

[[test]]
name = "command"
path = "tests/command/mod.rs"

[[test]]
name = "guard"
path = "tests/guard/main.rs"

[[test]]
name = "operator-line"
path = "tests/operator/line/main.rs"

[[test]]
name = "operator-release"
path = "tests/operator/release/main.rs"

[[test]]
name = "operator-repository"
path = "tests/operator/repository/main.rs"

[[test]]
name = "repository"
path = "tests/repository/main.rs"

[dependencies]
plumb = { path = "../lib", features = ["radius", "skill", "vendor"] , version = "=0.0.0" }
runseal = { version = "=0.18.8", registry = "perish", default-features = false }
locus = { version = "0", registry = "perish" }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"
toml_edit = "0.23"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
