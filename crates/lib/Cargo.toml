[package]
name = "plumb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["perish"]

[features]
radius = [
  "dep:semver",
  "dep:serde_json",
]
forge = [
  "dep:semver",
  "dep:serde_json",
]
skill = [
  "dep:flate2",
  "dep:semver",
  "dep:serde_json",
  "dep:tar",
  "dep:ureq",
]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", optional = true }
semver = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
tar = { version = "0.4", optional = true }
ureq = { version = "3", optional = true }
pin-project-lite = "0.2"
plumb-macro = { path = "../macro", version = "=0.18.15", registry = "perish" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.9"

[[test]]
name = "skill"
required-features = ["skill"]

[[test]]
name = "forge"
path = "tests/forge/mod.rs"
required-features = ["forge"]

[[test]]
name = "runtime"
path = "tests/runtime/mod.rs"

[[test]]
name = "proof"
path = "tests/proof/mod.rs"
required-features = ["radius"]

[[test]]
name = "survey"
required-features = ["skill"]
