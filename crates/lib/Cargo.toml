[package]
name = "plumb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["perish"]

[package.metadata.perish.guard]
schema = 1
depot = "ae4e158d5a91cf335dda2c949f445d5400f5b57f095a726cc90d899adedcbfc1"

[features]
depot = [
  "dep:ureq",
]
delivery = []
observation = [
  "dep:locus",
]
radius = [
]
vendor = [
  "delivery",
]
skill = [
  "depot",
  "dep:flate2",
  "dep:tar",
]
testing = []

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", optional = true }
locus = { version = "0", registry = "perish", optional = true }
semver = "1"
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", optional = true }
ureq = { version = "3", optional = true }
pin-project-lite = "0.2"
radicula-lock = { version = "0", registry = "perish" }
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }
tempfile = "3"
which = "8"
plumb-macro = { path = "../macro", version = "=0.0.0", registry = "perish" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
serde_yaml_ng = "0.10"
dunce = "1"

[dev-dependencies]
plumb = { path = ".", features = ["testing"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.9"

[[test]]
name = "cascade"
path = "tests/cascade/mod.rs"

[[test]]
name = "identity"
path = "tests/runtime/identity/mod.rs"

[[test]]
name = "knowledge"
path = "tests/knowledge/main.rs"

[[test]]
name = "skill"
required-features = ["skill"]

[[test]]
name = "vendor"
path = "tests/vendor/mod.rs"
required-features = ["vendor"]

[[test]]
name = "delivery"
path = "tests/proof/delivery.rs"
required-features = ["delivery"]

[[test]]
name = "runtime"
path = "tests/runtime/mod.rs"

[[test]]
name = "lane"
path = "tests/runtime/identity/lane/main.rs"

[[test]]
name = "proof"
path = "tests/proof/mod.rs"
required-features = ["radius"]

[[test]]
name = "survey"
required-features = ["skill"]

[[test]]
name = "bucket"
path = "tests/support/bucket.rs"
required-features = ["depot"]


[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
